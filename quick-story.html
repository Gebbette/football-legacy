<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110c">
<title>Football Legacy — Quick Story</title>
<style>
*{box-sizing:border-box}:root{--bg:#050b08;--panel:#0c1812;--panel2:#10221a;--text:#f4fff8;--muted:#9ab0a2;--line:rgba(236,255,243,.10);--accent:#6df3aa;--accent2:#32c97d;--gold:#ffd96c;--blue:#80c5ff;--violet:#a693ff;--red:#ff8190;--shadow:0 22px 70px rgba(0,0,0,.32);--radius:28px;--mode:#6df3aa;--mode2:#32c97d}
html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% -8%,rgba(109,243,170,.13),transparent 28%),radial-gradient(circle at 100% 18%,rgba(128,197,255,.09),transparent 27%),linear-gradient(180deg,#050b08,#07130d 48%,#050b08);overflow-x:hidden}body[data-mode="original"]{--mode:#6df3aa;--mode2:#32c97d}body[data-mode="express"]{--mode:#94e7b9;--mode2:#5fc48d;background:radial-gradient(circle at 9% -8%,rgba(109,243,170,.10),transparent 28%),radial-gradient(circle at 100% 18%,rgba(128,197,255,.08),transparent 27%),linear-gradient(180deg,#06100c,#0a1711 48%,#060e0a)}body[data-mode="story"]{--mode:#9ebfff;--mode2:#8f79ff;background:radial-gradient(circle at 5% -5%,rgba(142,121,255,.15),transparent 30%),radial-gradient(circle at 100% 20%,rgba(92,171,255,.12),transparent 30%),linear-gradient(180deg,#070b13,#091321 50%,#060a11)}
button,select{font:inherit}button{border:0;cursor:pointer;min-height:46px;padding:12px 16px;border-radius:16px;font-weight:900;transition:transform .16s ease,filter .16s ease,border-color .16s ease}button:active{transform:scale(.97)}button:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--mode) 55%,transparent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{color:#04160d;background:linear-gradient(135deg,var(--mode),var(--mode2));box-shadow:0 12px 28px color-mix(in srgb,var(--mode) 20%,transparent)}.secondary{color:var(--text);background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.075)}.gold{color:#211600;background:linear-gradient(135deg,#ffe58d,#efb840)}.danger{color:#ffe0e4;background:rgba(190,60,77,.28);border:1px solid rgba(255,129,144,.18)}
.app{width:min(100%,1080px);margin:auto;padding:14px 14px 88px}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 13px}.brand{display:flex;gap:10px;align-items:center;font-weight:1000;letter-spacing:-.025em}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#04160d;background:linear-gradient(145deg,#84f7b8,#d8ffe7);box-shadow:0 10px 30px rgba(59,211,132,.2)}.topActions{display:flex;gap:8px}.iconBtn{width:44px;padding:0}.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(155deg,rgba(17,34,25,.95),rgba(7,17,12,.96));box-shadow:var(--shadow)}body[data-mode="story"] .panel{background:linear-gradient(155deg,rgba(18,28,49,.96),rgba(7,14,26,.97))}body[data-mode="express"] .panel{background:linear-gradient(155deg,rgba(16,31,24,.96),rgba(7,15,12,.98))}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mode);font-weight:950}.muted,.subline{color:var(--muted);line-height:1.48}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill,.modeBadge,.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055)}.modeBadge{color:var(--mode);border-color:color-mix(in srgb,var(--mode) 30%,transparent);background:color-mix(in srgb,var(--mode) 10%,transparent)}
/* landing */
.landingHero{position:relative;overflow:hidden;padding:clamp(21px,5vw,42px)}.landingHero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-120px;border:1px solid rgba(109,243,170,.12);box-shadow:0 0 0 40px rgba(109,243,170,.025),0 0 0 85px rgba(109,243,170,.015)}.landingHero h1{font-size:clamp(42px,10vw,78px);line-height:.93;letter-spacing:-.07em;margin:10px 0 14px;max-width:800px}.landingHero p{max-width:720px;font-size:clamp(14px,2vw,18px);margin:0}.stadium{height:205px;margin:25px 0 10px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:25px;background:linear-gradient(180deg,#08120d 0 41%,#10271b 41% 47%,#18784a 47%)}.stands{position:absolute;inset:9px 8px 85px;background:repeating-linear-gradient(90deg,#14231b 0 10px,#20392b 10px 14px);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);border-radius:18px}.lights{position:absolute;top:15px;left:10%;right:10%;height:8px;background:radial-gradient(circle,#ffffe8 0 2px,transparent 3px) 0 0/27px 8px repeat-x;filter:drop-shadow(0 0 8px rgba(255,255,220,.75))}.pitch{position:absolute;left:5%;right:5%;bottom:-31px;height:123px;background:repeating-linear-gradient(90deg,#23895a 0 46px,#1c7a50 46px 92px);transform:perspective(260px) rotateX(20deg);border:2px solid rgba(255,255,255,.55)}.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.6)}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;border:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}.modeIntro{padding:25px 4px 10px}.modeIntro h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.045em;margin:4px 0 7px}.modeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.modeCard{position:relative;overflow:hidden;padding:20px;min-width:0}.modeCard:before{content:"";position:absolute;right:-55px;top:-55px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--cardAccent),transparent 68%);opacity:.17}.modeCard.original{--cardAccent:#6df3aa}.modeCard.express{--cardAccent:#9ceabf}.modeCard.story{--cardAccent:#9f8cff}.modeCard.recommended{border-color:rgba(109,243,170,.32);box-shadow:0 20px 65px rgba(50,201,125,.12)}.recommend{position:absolute;right:12px;top:12px;font-size:9px;font-weight:1000;letter-spacing:.1em;padding:6px 8px;border-radius:999px;color:#06170d;background:#75efac}.modeIcon{font-size:36px;margin:3px 0 11px}.modeCard h3{font-size:23px;margin:0 0 4px;letter-spacing:-.04em}.modeTime{font-size:12px;font-weight:900;color:var(--cardAccent);margin-bottom:12px}.featureList{display:grid;gap:8px;margin:14px 0 18px}.feature{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;color:#d5e5da;font-size:12px;line-height:1.38}.feature span:first-child{color:var(--cardAccent);font-weight:1000}.modeCard button{width:100%}.dailyRow{margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035)}.resume{margin-top:14px;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.resume strong{display:block}.resume small{display:block;color:var(--muted);margin-top:4px}
/* reveal */
.playerReveal{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center;margin:17px 0}.bigOvr{aspect-ratio:1;border-radius:30px;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--mode) 23%,transparent),rgba(255,255,255,.035));border:1px solid color-mix(in srgb,var(--mode) 30%,transparent)}.bigOvr strong{font-size:52px;line-height:1;color:var(--mode)}.bigOvr small{font-size:9px;letter-spacing:.13em;color:var(--muted);font-weight:900}.revealInfo h3{font-size:25px;margin:4px 0 9px}.pillRow{display:flex;gap:6px;flex-wrap:wrap}
/* game shell */
.gameHead{position:sticky;top:7px;z-index:30;padding:11px 13px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;backdrop-filter:blur(18px);background:rgba(7,18,12,.87);margin-bottom:9px}body[data-mode="story"] .gameHead{background:rgba(8,15,27,.88)}body[data-mode="express"] .gameHead{background:rgba(7,18,12,.88)}.crest{width:51px;height:51px;display:grid;place-items:center;border-radius:17px;font-size:13px;font-weight:1000;letter-spacing:-.04em;background:linear-gradient(145deg,color-mix(in srgb,var(--mode) 22%,#14201a),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 24%,transparent)}.playerTitle{min-width:0}.playerTitle strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerTitle small{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headRight{display:flex;align-items:center;gap:8px}.headMode{display:block;text-align:right;font-size:9px;font-weight:1000;letter-spacing:.08em;color:var(--mode);margin-bottom:3px}.ovrBox{text-align:center}.ovrBox strong{display:block;color:var(--gold);font-size:27px;line-height:1}.ovrBox small{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.1em}.tabs{position:sticky;top:80px;z-index:29;display:flex;gap:5px;padding:5px;margin-bottom:10px;backdrop-filter:blur(18px);background:rgba(7,18,12,.88);overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}body[data-mode="story"] .tabs{background:rgba(8,15,27,.88)}body[data-mode="express"] .tabs{background:rgba(7,18,12,.88)}.tab{padding:9px 6px;background:transparent;color:var(--muted);flex:1 0 110px;min-width:0}.tab.active{color:var(--text);background:color-mix(in srgb,var(--mode) 12%,transparent);border:1px solid color-mix(in srgb,var(--mode) 20%,transparent)}.screen{display:none}.screen.active{display:block}.gameModeBanner{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;margin-bottom:9px;border-radius:20px;background:linear-gradient(90deg,color-mix(in srgb,var(--mode) 12%,transparent),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 17%,transparent)}.gameModeBanner b{font-size:12px}.gameModeBanner small{color:var(--muted);font-size:10px}
/* journey */
.journeyHero{position:relative;overflow:hidden;padding:22px;margin-bottom:10px;background:radial-gradient(circle at 92% 12%,color-mix(in srgb,var(--mode) 17%,transparent),transparent 34%),linear-gradient(155deg,rgba(18,37,27,.96),rgba(7,18,12,.97))}body[data-mode="story"] .journeyHero{background:radial-gradient(circle at 92% 12%,rgba(146,127,255,.18),transparent 35%),linear-gradient(155deg,rgba(19,31,54,.98),rgba(7,14,27,.98))}body[data-mode="story"] .journeyHero{background:radial-gradient(circle at 90% 10%,rgba(255,217,108,.20),transparent 34%),linear-gradient(155deg,#242016,#0d0d0a)}.journeyHero h2{font-size:clamp(30px,6vw,46px);letter-spacing:-.055em;margin:6px 0}.seasonKicker{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}.progress i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--mode2),var(--mode))}.statGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.042);border:1px solid rgba(255,255,255,.05);min-width:0}.stat small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.stat strong{font-size:19px;overflow-wrap:anywhere}.nextAction{margin-top:14px}.nextAction button{width:100%;min-height:58px;font-size:16px}.clubSpotlight{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin:10px 0}.clubCard,.attributePanel,.feedPanel,.seasonCard,.marketHero,.legacyHero{padding:18px}.clubIdentity{display:flex;gap:12px;align-items:center}.clubIdentity .crest{width:62px;height:62px;border-radius:21px;font-size:15px}.clubIdentity h3{margin:2px 0 4px;font-size:20px}.metricRows{display:grid;gap:8px;margin-top:14px}.metricRow{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:12px}.metricRow span{color:var(--muted)}.attributeMini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.miniAttr{padding:10px;border-radius:15px;background:rgba(255,255,255,.04)}.miniAttrTop{display:flex;justify-content:space-between;gap:7px;font-size:11px}.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--mode2),var(--mode))}.storyCallout{padding:17px;margin:10px 0;border-radius:23px;background:linear-gradient(135deg,color-mix(in srgb,var(--mode) 11%,transparent),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 20%,transparent)}.storyCallout h3{font-size:20px;margin:4px 0 7px}.storyContext{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{color:#fff;text-align:left;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.06);padding:12px}.choice small{display:block;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.35}.seasonTop{display:flex;justify-content:space-between;gap:12px}.grade{width:63px;height:63px;border-radius:21px;display:grid;place-items:center;flex:0 0 63px;font-size:24px;font-weight:1000;color:var(--gold);background:rgba(255,217,108,.10);border:1px solid rgba(255,217,108,.25)}.resultStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.resultStrip div{padding:9px;border-radius:14px;background:rgba(255,255,255,.04);text-align:center}.resultStrip small{display:block;color:var(--muted);font-size:9px}.resultStrip strong{font-size:17px}.awardList{display:flex;gap:7px;flex-wrap:wrap}.trophyBadge{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;padding:9px 11px;border-radius:15px;color:#2a1a00;font-size:11px;font-weight:1000;background:linear-gradient(135deg,#fff0a7,#f3b83e);box-shadow:0 8px 24px rgba(241,184,62,.15)}body[data-mode="story"] .trophyBadge{padding:11px 13px;font-size:12px;box-shadow:0 0 24px rgba(255,209,86,.22)}.awardBadge{display:inline-flex;gap:6px;align-items:center;padding:9px 11px;border-radius:15px;color:#e9e2ff;font-size:11px;font-weight:1000;background:rgba(159,140,255,.14);border:1px solid rgba(159,140,255,.2)}.reel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.moment{min-height:108px;padding:12px;border-radius:18px;background:rgba(255,255,255,.037);border:1px solid rgba(255,255,255,.05)}.moment .mIcon{font-size:23px}.moment b{display:block;font-size:12px;margin:7px 0 4px}.moment small{color:var(--muted);font-size:10px;line-height:1.4}.feed{display:grid}.feedItem{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06)}.feedIcon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05)}.feedItem b{font-size:12px}.feedItem small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:3px}
/* player */
.playerHero{padding:20px;margin-bottom:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:15px;align-items:center}.playerHero .bigOvr{width:118px}.playerHero h2{font-size:30px;letter-spacing:-.045em;margin:4px 0}.attributeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}.attribute{padding:12px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}.attributeTop{display:flex;align-items:end;justify-content:space-between;gap:8px}.attributeTop span{font-size:10px;color:var(--muted);font-weight:900}.attributeTop strong{font-size:22px}.profileGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profileCard{padding:17px}.profileCard h3{margin:4px 0 7px}
/* market */
.marketHero h2,.legacyHero h2{font-size:31px;letter-spacing:-.045em;margin:5px 0}.stayCard{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.offerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.offer{padding:17px}.offerHeader{display:flex;gap:11px;align-items:center}.offerHeader h3{margin:2px 0;font-size:19px}.compare{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:stretch;margin:13px 0}.compareClub{padding:11px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}.compareClub.target{border-color:color-mix(in srgb,var(--mode) 22%,transparent);background:color-mix(in srgb,var(--mode) 7%,transparent)}.compareClub b{font-size:11px}.compareClub small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.versus{display:grid;place-items:center;color:var(--muted);font-weight:1000;font-size:10px}.fit{padding:11px;border-radius:17px;background:color-mix(in srgb,var(--mode) 8%,transparent);border:1px solid color-mix(in srgb,var(--mode) 16%,transparent);margin:10px 0}.fitTop{display:flex;justify-content:space-between;gap:10px}.fit strong{color:var(--mode)}
/* legacy */
.legacyScore{display:flex;gap:15px;align-items:center;margin-top:15px}.scoreRing{width:108px;height:108px;border-radius:34px;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--mode) calc(var(--score)*1%),rgba(255,255,255,.07) 0);position:relative}.scoreRing:after{content:"";position:absolute;inset:7px;border-radius:29px;background:#0d1b14}body[data-mode="story"] .scoreRing:after{background:#10192b}body[data-mode="story"] .scoreRing:after{background:#19160f}.scoreRing strong,.scoreRing small{position:relative;z-index:1}.scoreRing strong{font-size:34px}.scoreRing small{font-size:8px;color:var(--muted);font-weight:900}.timeline{display:grid}.timelineRow{display:grid;grid-template-columns:68px 40px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.055)}.year{font-size:10px;color:var(--muted)}.miniCrest{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.055);font-size:9px;font-weight:1000}.timelineRow b{font-size:11px}.timelineRow small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.seasonOvr{font-size:17px;font-weight:1000;color:var(--gold)}.chart{width:100%;height:auto;margin-top:15px}.chart text{fill:var(--muted);font-size:10px}.chart .line{fill:none;stroke:var(--mode);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:color-mix(in srgb,var(--mode) 9%,transparent)}.chart .gridline{stroke:rgba(255,255,255,.09)}.careerEnd{text-align:center;padding:25px;margin-top:10px}.careerEnd .scoreRing{margin:15px auto}.shareText{text-align:left;white-space:pre-wrap;padding:12px;border-radius:16px;background:rgba(0,0,0,.18);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:13px 0}.empty{padding:28px 15px;text-align:center;color:var(--muted)}
/* modal / celebration */

 landing.querySelectorAll('[data-play-mode]').forEach(b=>b.onclick=()=>previewCareer('FL-'+Math.random().toString(36).slice(2,9).toUpperCase(),b.dataset.playMode));document.getElementById('dailyStart').onclick=()=>{const d=new Date(),seed=`DAILY-${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;previewCareer(seed,'express')};if(saved)document.getElementById('resumeBtn').onclick=()=>{state=saved;startGame()}}
function playerRevealHtml(st){const p=st.player,m=modeInfo(st.mode),cp=clubProfile(p.club);return `<div class="eyebrow">${m.icon} ${esc(m.name)} MODE • ${esc(m.time)}</div><h2>${esc(p.name)}</h2><p>${esc(m.desc)}</p><div class="playerReveal"><div class="bigOvr"><strong>${p.rating}</strong><small>OVERALL</small></div><div class="revealInfo"><div class="eyebrow">${esc(p.nationality)} • ${p.position}</div><h3>${esc(p.club)}</h3><div class="pillRow"><span class="pill">Age ${p.age}</span><span class="pill">${esc(POS_LABEL[p.position])}</span><span class="pill">${esc(p.archetype)}</span><span class="pill">Potential ${p.potential} <span class="dynamicTag">DYNAMIC</span></span><span class="pill">${esc(cp.division)}</span></div></div></div><div class="actions"><button class="primary" id="beginCareerBtn">Begin ${esc(m.name)} career</button><button class="secondary" id="rerollBtn">New player</button><button class="secondary" id="backModes">Compare modes</button></div>`}
function previewCareer(seed,mode){state=createCareer(seed,mode);document.body.dataset.mode=mode;showModal(playerRevealHtml(state));document.getElementById('beginCareerBtn').onclick=()=>{closeModal();save();window.flTrack?.('Career Started');startGame()};document.getElementById('rerollBtn').onclick=()=>previewCareer('FL-'+Math.random().toString(36).slice(2,9).toUpperCase(),mode);document.getElementById('backModes').onclick=()=>{closeModal();state=null;renderLanding()}}
function startGame(){document.body.dataset.mode=state.mode;const root=document.documentElement,oldBehavior=root.style.scrollBehavior;root.style.scrollBehavior='auto';root.style.overflowAnchor='none';document.body.style.overflowAnchor='none';document.getElementById('landing').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('settingsBtn').classList.remove('hidden');activeTab='journey';renderAll();document.activeElement?.blur();const resetScroll=()=>{root.scrollTop=0;document.body.scrollTop=0};resetScroll();requestAnimationFrame(()=>{resetScroll();setTimeout(()=>{resetScroll();root.style.scrollBehavior=oldBehavior;root.style.overflowAnchor='';document.body.style.overflowAnchor=''},35)})}

function tabsForMode(mode=state?.mode||'express'){return (MODE_INFO[mode]||MODE_INFO.express).tabs||['journey','player','market','legacy']}
const TAB_LABELS={journey:'Journey',player:'Player',market:'Market',world:'World',objectives:'Objectives',legacy:'Legacy'};
function renderTabs(){const tabs=tabsForMode();if(!tabs.includes(activeTab))activeTab=tabs[0];const nav=document.getElementById('tabs');if(!nav)return;nav.innerHTML=tabs.map(tab=>`<button class="tab ${tab===activeTab?'active':''}" data-tab="${tab}">${TAB_LABELS[tab]||tab}</button>`).join('');nav.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.tab;renderAll();scrollTo({top:0,behavior:'smooth'})})}

function modeBannerHtml(){const m=modeInfo();return `<div class="gameModeBanner"><div><b>${m.icon} ${esc(m.name)} Mode</b><small> • ${esc(m.tag)}</small></div><span class="modeBadge">${esc(m.time)}</span></div>`}
function renderAll(){if(!state)return renderLanding();normalizeAttributes(state.player);document.body.dataset.mode=state.mode;const p=state.player,m=modeInfo();document.getElementById('headCrest').textContent=initials(p.club);document.getElementById('headName').textContent=p.name;document.getElementById('headSub').textContent=`${p.club} • Age ${p.age} • ${POS_LABEL[p.position]}`;document.getElementById('headMode').textContent=`${m.icon} ${m.name.toUpperCase()}`;document.getElementById('headOvr').textContent=p.rating;document.getElementById('modeBanner').innerHTML=modeBannerHtml();renderTabs();document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='tab-'+activeTab));renderJourney();renderPlayer();renderMarket();renderLegacy();renderWorld();renderObjectives();save()}
function clubCardHtml(club,title='CURRENT CLUB'){const cp=clubProfile(club),role=roleAtClub(state,club);return `<div class="panel clubCard"><div class="eyebrow">${title}</div><div class="clubIdentity"><div class="crest">${initials(club)}</div><div><h3>${esc(club)}</h3><div class="subline">${esc(cp.country)} • ${esc(cp.division)}</div></div></div><div class="metricRows"><div class="metricRow"><span>Club reputation</span><b>${cp.rep}/100</b></div><div class="metricRow"><span>Squad level</span><b>${cp.level}</b></div><div class="metricRow"><span>Your role</span><b>${esc(role)}</b></div><div class="metricRow"><span>Club status</span><b>${esc(cp.stature)}</b></div></div></div>`}
function attrLabel(k){return ({pace:'Pace',shooting:'Shooting',passing:'Passing',dribbling:'Dribbling',defending:'Defending',physical:'Physical',keeping:'Keeping',reflexes:'Reflexes'})[k]||k}
function attributesHtml(compact=false){const p=state.player,items=Object.entries(p.attributes);if(compact){const focus=items.sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="attributeMini">${focus.map(([k,v])=>`<div class="miniAttr"><div class="miniAttrTop"><span>${attrLabel(k)}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div>`}return `<div class="attributeGrid">${items.map(([k,v])=>`<div class="attribute"><div class="attributeTop"><span>${attrLabel(k)}</span><strong>${v}</strong></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div>`}
function renderJourney(){const b=document.getElementById('tab-journey'),p=state.player,last=state.lastSeason,progress=careerProgress(state);const action=state.ended?'Career complete':state.pendingOffers.length?'Review transfer offer':state.pendingStory?'Make your decision':`Play ${currentSeasonLabel(state)} season`;b.innerHTML=`<div class="panel journeyHero"><div class="seasonKicker"><span class="modeBadge">${modeInfo().icon} ${esc(modeInfo().name)} MODE</span><span class="pill">${state.ended?'FINAL WHISTLE':`SEASON ${seasonNumber(state)} • ${currentSeasonLabel(state)}`}</span></div><h2>${state.ended?'Your career is complete':esc(p.club)}</h2><div class="subline">${state.ended?`${esc(p.name)} retires after ${state.history.length} professional seasons.`:`${esc(roleAtClub(state))} • ${esc(clubProfile(p.club).division)} • ${p.clubYears} season${p.clubYears===1?'':'s'} at club${p.captain?' • Club captain':''}`}</div><div class="progress"><i style="width:${progress}%"></i></div><div class="statGrid"><div class="stat"><small>AGE</small><strong>${p.age}</strong></div><div class="stat"><small>OVR</small><strong>${p.rating}</strong></div><div class="stat"><small>DYNAMIC POT.</small><strong>${p.potential}</strong></div><div class="stat"><small>REPUTATION</small><strong>${p.reputation}</strong></div></div><div class="nextAction"><button class="primary" id="mainAction" ${state.ended?'disabled':''}>${modeInfo().icon} ${esc(action)}</button></div></div><div class="clubSpotlight">${clubCardHtml(p.club)}<div class="panel attributePanel"><div class="eyebrow">PLAYER SNAPSHOT</div><h3 style="margin:5px 0">Your strongest attributes</h3><div class="subline">Attributes develop alongside your overall. Potential is dynamic: sustained high-level seasons can raise the ceiling.</div>${attributesHtml(true)}<button class="secondary" id="openPlayer" style="width:100%;margin-top:12px">View full player profile</button></div></div>${state.pendingStory?storyHtml(state.pendingStory):''}${state.storyDecisionReady?storyDecisionReadyHtml(state.storyDecisionReady):''}${last?seasonSummaryHtml(last):''}<div class="panel feedPanel"><div class="eyebrow">CAREER FEED</div><div class="feed">${state.news.slice(0,state.mode==='story'?4:state.mode==='express'?6:10).map(n=>`<div class="feedItem"><div class="feedIcon">${n.icon}</div><div><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div></div>`).join('')}</div></div>${state.ended?careerEndHtml():''}`;
 const main=document.getElementById('mainAction');if(main&&!state.ended)main.onclick=()=>{if(state.pendingOffers.length){activeTab='market';renderAll();scrollTo({top:0,behavior:'smooth'})}else if(state.pendingStory){document.getElementById('storyBox')?.scrollIntoView({behavior:'smooth',block:'center'})}else playSeasonUI(null)};document.getElementById('openPlayer')?.addEventListener('click',()=>{activeTab='player';renderAll();scrollTo({top:0,behavior:'smooth'})});b.querySelectorAll('[data-story-choice]').forEach(x=>x.onclick=()=>resolveStoryChoiceUI(+x.dataset.storyChoice));bindShareButtons(b)}
function storyHtml(s){const riskWord=i=>i===0?'SAFER':i===1?'BALANCED':i===2?'BOLDER':'CHOICE';return `<div class="storyCallout" id="storyBox"><div class="eyebrow">DECISION</div><h3>${s.icon} ${esc(s.title)}</h3><div class="subline">${esc(s.text)}</div><div class="storyContext">${(s.context||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="choiceGrid">${s.choices.map((c,i)=>`<button class="choice" data-story-choice="${i}"><span class="eyebrow">${riskWord(i)}</span><b>${esc(c[0])}</b><small>${esc(c[1])}</small></button>`).join('')}</div></div>`}
function storyDecisionReadyHtml(x){return `<div class="fl-decision-saved" id="storyDecisionSaved"><b>✓ Decision saved.</b> Press <b>Play Season</b> when you are ready.</div>`}
function resolveStoryChoiceUI(choiceIndex){if(!state?.pendingStory)return;const title=state.pendingStory.title,choice=state.pendingStory.choices?.[choiceIndex]?.[0]||'Decision';const mod=storyModifier(state,choiceIndex);state.queuedStoryMod=mod;state.storyDecisionReady={title,text:`${title}: ${choice}`};state.news.unshift({icon:'✅',title:'Decision saved',text:`${title}: ${choice}.`});state.news=state.news.slice(0,14);save();activeTab='journey';renderAll();toast('Decision saved — Play Season when ready');setTimeout(()=>{const b=document.getElementById('mainAction');if(b){b.scrollIntoView({behavior:'smooth',block:'center'});b.focus({preventScroll:true})}},100)}
function scenarioImpactHtml(s){const x=s?.scenarioImpact;if(!x)return '';return `<div class="fl-scenario-impact ${x.tone||'mixed'}"><div class="eyebrow">YOUR DECISION • ${esc(x.verdict)}</div><b>${esc(x.title)}</b><div class="fl-impact-choice">You chose: ${esc(x.choice)}</div><small>${esc(x.detail)}</small></div>`}
function seasonSummaryHtml(s){const g=seasonGradeInfo(s.avg);return `<div class="panel seasonCard"><div class="seasonTop"><div><div class="eyebrow">LAST SEASON • ${esc(s.label)}</div><h3 style="margin:5px 0 3px">${esc(s.club)} finished ${ordinal(s.position)}</h3><div class="subline">${esc(s.role)} • ${esc(s.league)}</div></div><div class="grade fl-grade" title="Season grade: ${g.grade} — ${g.label}, based on a ${s.avg.toFixed(2)} match average"><strong>${g.grade}</strong><small>${g.label}<br>${s.avg.toFixed(2)} avg</small></div></div><div class="resultStrip"><div><small>APPS</small><strong>${s.apps}</strong></div><div><small>GOALS</small><strong>${s.goals}</strong></div><div><small>ASSISTS</small><strong>${s.assists}</strong></div><div><small>AVG</small><strong>${s.avg.toFixed(2)}</strong></div></div>${scenarioImpactHtml(s)}${s.trophies.length||s.awards.length?`<div class="awardList">${s.trophies.map(trophyHtml).join('')}${s.awards.map(awardHtml).join('')}</div>`:''}<div class="developmentNote"><b>Development:</b> ${s.ratingChange>0?`OVR +${s.ratingChange}`:s.ratingChange<0?`OVR ${s.ratingChange}`:'OVR unchanged'} • Potential ${s.endPotential??state.player.potential}${s.potentialChange>0?' ↑':''}</div><div class="reel">${s.moments.map(m=>`<div class="moment"><div class="mIcon">${m.icon}</div><b>${esc(m.title)}</b><small>${esc(m.text)}</small></div>`).join('')}</div></div>`}
function seasonModalHtml(s,delta){const won=s.trophies.length||s.awards.length,isQuick=state.mode==='story',g=seasonGradeInfo(s.avg),headline=s.trophies[0]||s.awards[0]||`${g.grade} — ${g.label}`,tiles=[...s.trophies.map(x=>({x,icon:'🏆',award:false})),...s.awards.map(x=>({x,icon:'⭐',award:true}))];return `<div class="${won?'celebrate':''}">${won?`<div class="trophyStage"><div class="trophyShine"></div>${trophyVisual(s.trophies.length?'trophy':'award')}</div><div class="trophyKicker">${s.trophies.length?'TROPHY WON':'MAJOR AWARD'}</div>`:''}<div class="eyebrow" style="margin-top:${won?'10px':'0'}">${esc(s.label)} COMPLETE • ${modeInfo().icon} ${esc(modeInfo().name)} MODE</div><h2 class="${won?'celebrateTitle':''}">${esc(headline)}</h2><p>${esc(s.club)} finished <strong>${ordinal(s.position)}</strong>. You made <strong>${s.apps}</strong> appearances with <strong>${s.goals} goals</strong> and <strong>${s.assists} assists</strong>.</p>${scenarioImpactHtml(s)}${won?`<div class="trophyShelf">${tiles.map(t=>`<div class="trophyTile ${t.award?'awardTile':''}">${trophyVisual(t.award?'award':'trophy',true)}<b>${esc(t.x)}</b></div>`).join('')}</div>`:''}<div class="statGrid"><div class="stat"><small>SEASON GRADE</small><strong>${g.grade}</strong><span class="fl-grade-caption">${g.label} • ${s.avg.toFixed(2)} avg</span></div><div class="stat"><small>OVR CHANGE</small><strong class="${delta>0?'positive':delta<0?'negative':''}">${delta>0?'+':''}${delta}</strong></div><div class="stat"><small>DYNAMIC POT.</small><strong class="${s.potentialChange>0?'positive':''}">${s.endPotential??state.player.potential}${s.potentialChange>0?' ↑':''}</strong></div><div class="stat"><small>OFFERS</small><strong>${state.pendingOffers.length}</strong></div></div>${isQuick&&won?'<p style="font-weight:900;color:var(--gold)">Career highlight unlocked.</p>':''}<div class="actions" style="margin-top:15px"><button class="primary" id="seasonContinue">${state.ended?'See my legacy':'Back to Career Home'}</button></div></div>`}
function playSeasonUI(choice){const before=state.player.rating,s=simulateSeason(state,choice);if(!s)return renderAll();state.storyDecisionReady=null;save();activeTab=state.ended?'legacy':'journey';renderAll();const delta=state.player.rating-before;showModal(seasonModalHtml(s,delta));if(s.trophies.length||s.awards.length)confetti(state.mode==='story'?70:40);document.getElementById('seasonContinue').onclick=()=>{closeModal();activeTab=state.ended?'legacy':'journey';renderAll();scrollTo({top:0,behavior:'smooth'})}}
function renderPlayer(){const b=document.getElementById('tab-player'),p=state.player,c=p.career;b.innerHTML=`<div class="panel playerHero"><div class="bigOvr"><strong>${p.rating}</strong><small>OVERALL</small></div><div><div class="eyebrow">PLAYER PROFILE</div><h2>${esc(p.name)}</h2><div class="subline">${esc(p.nationality)} • ${esc(POS_LABEL[p.position])} • Age ${p.age} • ${esc(p.archetype)}</div><div class="pillRow" style="margin-top:10px"><span class="pill">Potential ${p.potential} <span class="dynamicTag">DYNAMIC</span></span><span class="pill">Peak ${p.peak}</span><span class="pill">${p.captain?'© Club captain':esc(roleAtClub(state))}</span></div></div></div><div class="panel attributePanel"><div class="eyebrow">ATTRIBUTES</div><h3 style="margin:5px 0">Your football profile</h3><div class="subline">These ratings move with development and decline rather than being hidden behind overall alone.</div>${attributesHtml(false)}</div><div class="profileGrid" style="margin-top:10px">${clubCardHtml(p.club)}<div class="panel profileCard"><div class="eyebrow">CAREER NUMBERS</div><h3>${state.history.length} seasons played</h3><div class="metricRows"><div class="metricRow"><span>Appearances</span><b>${c.apps}</b></div><div class="metricRow"><span>Goals / assists</span><b>${c.goals} / ${c.assists}</b></div><div class="metricRow"><span>International caps</span><b>${c.caps}</b></div><div class="metricRow"><span>Trophies / awards</span><b>${c.trophies.length} / ${c.awards.length}</b></div></div></div></div>`}
function offerHtml(o,i){const cur=clubProfile(state.player.club),tar=clubProfile(o.club),fitLabel=transferFitLabel(o.fit);return `<div class="panel offer"><div class="offerHeader"><div class="crest">${initials(o.club)}</div><div><div class="eyebrow">TRANSFER OFFER • ${esc(o.country)}</div><h3>${esc(o.club)}</h3><div class="subline">${esc(o.division)}</div></div></div><div class="compare"><div class="compareClub"><b>${esc(cur.club)}</b><small>${esc(cur.division)}</small><div class="metricRows"><div class="metricRow"><span>Rep</span><b>${cur.rep}</b></div><div class="metricRow"><span>Squad</span><b>${cur.level}</b></div><div class="metricRow"><span>Role</span><b>${esc(roleAtClub(state,cur.club))}</b></div></div></div><div class="versus">VS</div><div class="compareClub target"><b>${esc(tar.club)}</b><small>${esc(tar.division)}</small><div class="metricRows"><div class="metricRow"><span>Rep</span><b>${tar.rep}</b></div><div class="metricRow"><span>Squad</span><b>${tar.level}</b></div><div class="metricRow"><span>Role</span><b>${esc(o.role)}</b></div></div></div></div><div class="fit fl-fit-${o.fit>=76?'great':o.fit<44?'poor':'mid'}"><div class="fitTop"><span>Career Fit</span><strong>${o.fit}/100 <em>${esc(fitLabel)}</em></strong></div><div class="bar"><i style="width:${o.fit}%"></i></div><small class="fl-fit-help">How suitable this move looks for your level, likely role, playing time and career stage.</small></div><div class="interestReason"><strong>Why they want you:</strong> ${esc(o.reason||'A realistic fit for their squad.')}</div><div class="transferFinance"><div class="financeChip"><small>TRANSFER FEE</small><b>${money(o.fee,o.currency)}</b></div><div class="financeChip"><small>CLUB CAPACITY</small><b>${money(o.budget||0,o.currency)}</b></div><div class="financeChip"><small>BUDGET USED</small><b>${o.feePct??'—'}%</b></div><div class="financeChip"><small>FINANCES</small><b>${esc(o.finance||tar.stature)}</b></div></div><button class="primary offerAccept" data-accept="${i}" style="width:100%;margin-top:13px">Accept ${esc(o.club)}</button></div>`}
function renderMarket(){const b=document.getElementById('tab-market'),p=state.player,offers=state.pendingOffers;b.innerHTML=`<div class="panel marketHero"><div class="eyebrow">TRANSFER MARKET • ${modeInfo().icon} ${esc(modeInfo().name)} MODE</div><h2>${offers.length?'Choose your next chapter':'Perform first. Offers follow.'}</h2><div class="subline">${offers.length?`${offers.length} serious offer${offers.length===1?' is':'s are'} waiting. Every displayed bid has passed the game’s club-budget, squad-level, age and performance checks.`:`Your ${p.rating} OVR, dynamic potential, recent form, age and current club level drive interest. Clubs now have season-by-season transfer capacity and cannot bid above it.`}</div></div>${offers.length?`<div class="panel stayCard"><div><b>Stay at ${esc(p.club)}</b><div class="subline">Keep your current role, club years and continuity.</div></div><button class="secondary" id="stayBtn">Stay</button></div><div class="offerGrid">${offers.map(offerHtml).join('')}</div>`:`<div class="clubSpotlight">${clubCardHtml(p.club,'YOUR CURRENT SITUATION')}<div class="panel profileCard"><div class="eyebrow">WHAT CLUBS SEE</div><h3 style="margin:5px 0">${p.rating} OVR • ${esc(roleAtClub(state))}</h3><div class="subline">Strong performances can raise both overall and dynamic potential. Transfer interest is filtered by squad need, club stature and an internal financial-capacity model; under-18 players cannot receive international moves.</div></div></div>`}`;if(offers.length){document.getElementById('stayBtn').onclick=()=>{stayPut(state);maybeStory(state);save();activeTab='journey';renderAll();toast('You chose to stay')};b.querySelectorAll('[data-accept]').forEach(x=>x.onclick=()=>confirmOffer(+x.dataset.accept))}}

function ratingChartHtml(hist){if(!hist.length)return '';const vals=hist.map(s=>s.startRating+(s.ratingChange||0)),min=Math.max(40,Math.min(...vals)-4),max=Math.min(100,Math.max(...vals)+4),W=640,H=150,pad=20,pts=vals.map((v,i)=>[pad+(W-pad*2)*(hist.length===1?.5:i/(hist.length-1)),H-pad-(v-min)/(max-min||1)*(H-pad*2)]),line=pts.map(p=>p.join(',')).join(' '),area=`${pad},${H-pad} ${line} ${W-pad},${H-pad}`;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall rating history"><line class="gridline" x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}"/><polygon class="area" points="${area}"/><polyline class="line" points="${line}"/><text x="${pad}" y="12">OVR ${max}</text><text x="${pad}" y="${H-4}">${min}</text></svg>`}

function ensureGuide(){let g=$('#flScreenGuide');if(g)return g;g=make('section','fl-screen-guide');g.id='flScreenGuide';g.setAttribute('aria-live','polite');if(IS_QUICK){const mb=$('#modeBanner');if(mb)mb.insertAdjacentElement('afterend',g);else $('#game')?.prepend(g)}else{const bar=$('.modeIdentityBar');if(bar)bar.insertAdjacentElement('afterend',g);else $('main')?.prepend(g)}return g}

function markImportant(){const el=nextActionElement();if(!el){$$('.fl-action-caption').forEach(x=>x.remove());$$('.fl-important-action').forEach(x=>x.classList.remove('fl-important-action'));lastImportantKey='';return}let text='NEXT STEP — press this when you are ready.';const s=getState();if(IS_QUICK&&s?.pendingStory)text='STEP 2 — choose one option. The season will NOT start yet.';else if(IS_QUICK&&s?.storyDecisionReady)text='STEP 3 — your decision is saved. Press Play Season to continue.';else if(!IS_QUICK&&s?.pending)text='STEP 2 — resolve this decision, then return Home.';const key=`${currentKey()}|${text}|${el.id||el.getAttribute('data-tab')||el.getAttribute('data-screen')||el.className}`;const existing=$('.fl-action-caption');if(lastImportantKey===key&&existing?.dataset.flKey===key&&el.classList.contains('fl-important-action'))return;$$('.fl-action-caption').forEach(x=>x.remove());$$('.fl-important-action').forEach(x=>x.classList.remove('fl-important-action'));el.classList.add('fl-important-action');const cap=make('div','fl-action-caption',text);cap.dataset.flKey=key;const anchor=importantAnchor(el);anchor?.insertAdjacentElement('beforebegin',cap);lastImportantKey=key}

function getSteps(){return MODE==='quick'?getQuickSteps():MODE==='express'?getExpressSteps():getOriginalSteps()}
async function showTourStep(i){if(!tourSteps.length)return;tourIndex=Math.max(0,Math.min(tourSteps.length-1,i));const step=tourSteps[tourIndex];if(tourTarget)tourTarget.classList.remove('fl-tour-target');tourTarget=null;if(step.before){step.before();await wait(210)}let target=step.target?.();if(!target){await wait(180);target=step.target?.()}const c=ensureTourCard();$('#flTourCount').textContent=`STEP ${tourIndex+1} OF ${tourSteps.length}`;$('#flTourTitle').textContent=step.title;$('#flTourText').textContent=step.text;$('#flTourTip').textContent=step.tip||'';$('#flTourBack').disabled=tourIndex===0;$('#flTourNext').textContent=tourIndex===tourSteps.length-1?'Finish':'Next';c.hidden=false;if(target){tourTarget=target;target.classList.add('fl-tour-target');try{target.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(e){}await wait(290);positionTour(c,target)}else positionTour(c,null);announce(`${tourIndex+1} of ${tourSteps.length}. ${step.title}. ${step.text}`)}
function positionTour(c,target){const vw=innerWidth,vh=innerHeight,margin=12,cw=Math.min(390,vw-24),ch=Math.min(c.offsetHeight||240,vh-24);let left=margin,top=Math.max(margin,vh-ch-margin);if(target){const r=target.getBoundingClientRect();if(vw>780){left=r.right+14+cw<=vw-margin?r.right+14:Math.max(margin,r.left-cw-14);top=Math.min(vh-ch-margin,Math.max(margin,r.top+(r.height-ch)/2))}else{left=margin;if(r.bottom+12+ch<=vh-margin)top=r.bottom+12;else if(r.top-12-ch>=margin)top=r.top-ch-12;else top=vh-ch-margin}}c.style.left=Math.round(left)+'px';c.style.top=Math.round(top)+'px'}

<script id="flQuickStoryV5Ui">
(function(){
'use strict';
const V4={renderAll,renderTabs,renderJourney,renderLegacy,playSeasonUI,scenarioImpactHtml,maybeAwards};
MODE_INFO.story.tabs=['journey','legacy'];
TAB_LABELS.journey='Play Career';
TAB_LABELS.legacy='Legacy';

function isStory(){return state?.mode==='story'}
function awardCandidates(st,s){
 const p=st.player,contrib=s.goals+s.assists,attack=['ST','WG','AM'].includes(p.position),mid=['AM','CM','DM'].includes(p.position),def=['CB','FB','DM'].includes(p.position),out=[];
 const add=(name,ok,prob,priority)=>{if(ok&&chance(st,prob))out.push({name,priority})};
 add('Breakthrough Player of the Year',p.age<=20&&s.apps>=18&&s.avg>=6.92,.34,50);
 add('Young Player of the Year',p.age<=22&&s.apps>=22&&s.avg>=7.08,.29,58);
 add(`${p.club} Player of the Year`,s.apps>=23&&s.avg>=7.08,.32,44);
 add(`${p.club} Supporters’ Player of the Year`,s.apps>=24&&s.avg>=7.02&&contrib>=8,.22,42);
 add(`${p.club} Players’ Player of the Year`,s.apps>=25&&s.avg>=7.22,.19,46);
 add(`${s.league} Playmaker Award`,mid&&s.assists>=10&&s.avg>=7.05,.36,62);
 add(`${s.league} Golden Boot`,attack&&s.goals>=20,.46,72);
 add(`${s.league} Golden Glove`,p.position==='GK'&&s.apps>=27&&s.avg>=7.04&&s.position<=5,.37,70);
 add(`${s.league} Defender of the Year`,def&&s.apps>=25&&s.avg>=7.28,.25,73);
 add(`${s.league} Midfielder of the Year`,mid&&s.apps>=25&&s.avg>=7.30,.24,74);
 add(`${s.league} Player of the Year`,s.apps>=27&&s.avg>=7.46,.27,82);
 add('European Player of the Year',p.rating>=88&&s.avg>=7.48&&s.position<=4,.12,91);
 const ballonProb=clamp(.008+Math.max(0,p.rating-89)*.014+Math.max(0,s.avg-7.35)*.12+Math.max(0,contrib-34)*.0018+(s.trophies.includes('Champions League')?.045:0),.004,.18);
 add("Ballon d'Or",p.rating>=89&&s.avg>=7.35,ballonProb,100);
 let selected=out.sort((a,b)=>b.priority-a.priority);
 if(selected.some(x=>x.name==="Ballon d'Or"))selected=selected.filter(x=>x.name!=='European Player of the Year');
 return selected.slice(0,3).map(x=>x.name);
}
maybeAwards=function(st,s){
 if(st.mode!=='story')return V4.maybeAwards(st,s);
 const awards=awardCandidates(st,s);
 for(const name of awards)st.player.career.awards.push({year:st.year,name,club:st.player.club});
 return awards;
};

function quickVerdict(x){const n=Number(x?.score||0);return n>=.48?'EXCELLENT CHOICE':n>=.12?'GOOD CHOICE':n>-.18?'MIXED CHOICE':'POOR CHOICE'}
scenarioImpactHtml=function(s){
 if(!isStory())return V4.scenarioImpactHtml(s);
 const x=s?.scenarioImpact;if(!x)return '';
 const verdict=quickVerdict(x),tone=verdict==='EXCELLENT CHOICE'||verdict==='GOOD CHOICE'?'positive':verdict==='MIXED CHOICE'?'mixed':'negative';
 const delta=s.ratingChange>0?`+${s.ratingChange}`:`${s.ratingChange}`;
 return `<div class="quickImpact ${tone}"><strong>${verdict}</strong><div class="quickImpactLine">${esc(x.title)} — ${esc(x.choice)}</div><div class="quickImpactEffect">It helped shape a ${s.avg.toFixed(2)} average and ${delta} OVR.</div></div>`;
};

function quickHonours(items,type='award',limit=8){
 const names=(items||[]).map(x=>typeof x==='string'?x:x.name).filter(Boolean),counts=new Map();
 for(const name of names)counts.set(name,(counts.get(name)||0)+1);
 const all=[...counts.entries()],shown=all.slice(0,limit);
 let html=shown.map(([name,count])=>`<span class="quickHonour ${type==='trophy'?'trophy':''}">${type==='trophy'?'🏆':'⭐'} ${esc(name)}${count>1?` ×${count}`:''}</span>`).join('');
 if(all.length>limit)html+=`<span class="quickHonour">+${all.length-limit} more</span>`;
 return html;
}

function tutorialExamplesHtml(){return `<section class="quickTutorialExamples" aria-label="Tutorial examples"><h3>What can appear here</h3><p>These examples are only visible during the tutorial.</p><div class="quickExample"><div class="quickExampleLabel">PLAY A SEASON</div><button class="primary quickMainAction" id="quickExamplePlay" disabled>▶ Play Season</button></div><div class="quickExample" id="quickExampleScenario"><div class="quickExampleLabel">EXAMPLE DECISION</div><div class="quickChoices"><button class="quickChoice" disabled>Train harder</button><button class="quickChoice" disabled>Keep balance</button><button class="quickChoice" disabled>Recover</button></div></div><div class="quickExample" id="quickExampleTransfer"><div class="quickExampleLabel">EXAMPLE TRANSFER • CAREER FIT 84/100 — EXCELLENT FIT</div><div class="quickTransferActions"><button class="quickAccept" disabled>Accept Transfer</button><button class="quickReject" disabled>Reject Transfer</button></div></div></section>`}

function quickStoryCard(s){return `<section class="panel quickActionCard storyCallout" id="storyBox"><div class="eyebrow">DECISION</div><h3>${s.icon} ${esc(s.title)}</h3><p class="quickLead">What do you do?</p><div class="quickChoices">${s.choices.map((c,i)=>`<button class="quickChoice" data-story-choice="${i}">${esc(c[0])}</button>`).join('')}</div></section>`}

function quickTransferCard(o,i){const fit=transferFitLabel(o.fit);return `<section class="panel quickActionCard" id="quickTransferOffer"><div class="quickTransferHead"><div class="crest">${initials(o.club)}</div><div><div class="eyebrow">TRANSFER OFFER</div><h3>${esc(o.club)}</h3><div class="quickStatusLine">${esc(o.division)}</div></div></div><div class="quickTransferFacts"><div class="quickTransferFact"><small>YOUR ROLE</small><b>${esc(o.role)}</b></div><div class="quickTransferFact"><small>TRANSFER FEE</small><b>${money(o.fee,o.currency)}</b></div><div class="quickTransferFact"><small>CAREER FIT</small><b>${o.fit}/100 — ${esc(fit)}</b><div class="quickFitBar"><i style="width:${o.fit}%"></i></div></div></div><div class="quickTransferActions"><button class="quickAccept" data-quick-accept="${i}">Accept Transfer</button><button class="quickReject" data-quick-reject>Reject Transfer</button></div></section>`}

function quickActionHtml(){
 if(state.pendingOffers?.length)return quickTransferCard(state.pendingOffers[0],0);
 if(state.pendingStory)return quickStoryCard(state.pendingStory);
 if(state.ended)return `<section class="panel quickActionCard"><div class="eyebrow">CAREER COMPLETE</div><h3>Your final legacy is ready.</h3><p class="quickLead">The full result is in Legacy.</p><button class="gold quickMainAction" id="viewLegacyAction">🏆 View Legacy</button></section>`;
 const saved=state.storyDecisionReady?`<div class="quickDecisionSaved">✓ Choice saved. Now play the season.</div>`:'';
 return `<section class="panel quickActionCard">${saved}<button class="primary quickMainAction" id="mainAction">▶ Play ${esc(currentSeasonLabel(state))} Season</button></section>`;
}

function quickSeasonBrief(s){if(!s)return '';const g=seasonGradeInfo(s.avg),delta=s.ratingChange>0?`+${s.ratingChange}`:`${s.ratingChange}`;return `<section class="panel quickSeasonBrief"><div class="quickSeasonTop"><div><div class="eyebrow">LATEST RESULT • ${esc(s.label)}</div><h3>${esc(s.club)} • ${ordinal(s.position)}</h3><div class="quickStatusLine">${esc(s.role)}</div></div><div class="quickGrade" title="${g.grade} means ${g.label}, based on a ${s.avg.toFixed(2)} average"><strong>${g.grade}</strong><span>${g.label}<small>${s.avg.toFixed(2)} match average</small></span></div></div><div class="quickResultStats"><div><small>APPS</small><b>${s.apps}</b></div><div><small>GOALS</small><b>${s.goals}</b></div><div><small>ASSISTS</small><b>${s.assists}</b></div><div><small>OVR</small><b>${delta}</b></div></div>${scenarioImpactHtml(s)}${s.trophies.length||s.awards.length?`<div class="quickHonours">${quickHonours(s.trophies,'trophy',4)}${quickHonours(s.awards,'award',4)}</div>`:''}</section>`}

function quickFocusTarget(){return document.querySelector('[data-story-choice], [data-quick-accept], #mainAction, #viewLegacyAction')}
function focusQuickAction(){const target=quickFocusTarget();if(!target)return;target.classList.remove('quickPulse');void target.offsetWidth;target.classList.add('quickPulse');try{target.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}setTimeout(()=>{try{target.focus({preventScroll:true})}catch(e){}},260)}
function returnToPlay(){activeTab='journey';renderAll();setTimeout(focusQuickAction,80)}

function acceptQuick(i){const offer=state.pendingOffers?.[i];if(!offer)return;const club=offer.club;if(acceptOffer(state,i)){maybeStory(state);save();toast(`Transfer accepted — ${club}`);returnToPlay()}}
function rejectQuick(){if(!state.pendingOffers?.length)return;window.flTrack?.('Transfer Rejected');stayPut(state);maybeStory(state);save();toast('Transfer rejected');returnToPlay()}

 if(!isStory())return V4.renderJourney();
 const b=document.getElementById('tab-journey');if(!b)return;const p=state.player;
 b.innerHTML=`<section class="panel quickStatus"><div class="quickStatusTop"><span class="modeBadge">🎬 QUICK STORY</span><span class="pill">${state.ended?'FINAL WHISTLE':esc(currentSeasonLabel(state))}</span></div><h2>${state.ended?'Career complete':esc(p.club)}</h2><div class="quickStatusLine">${state.ended?`${state.history.length} seasons • Peak ${p.peak} OVR`:`${esc(roleAtClub(state))} • Age ${p.age} • ${esc(POS_LABEL[p.position])}`}</div><div class="quickStats"><div class="quickStat"><small>AGE</small><strong>${p.age}</strong></div><div class="quickStat"><small>OVR</small><strong>${p.rating}</strong></div><div class="quickStat"><small>POTENTIAL</small><strong>${p.potential}</strong></div></div></section>${quickActionHtml()}${tutorialExamplesHtml()}${quickSeasonBrief(state.lastSeason)}`;

function importantSeasons(){

 const key=h.filter((s,i)=>i===0||i===h.length-1||s.position===1||(s.trophies||[]).length||(s.awards||[]).length||Math.abs(s.ratingChange||0)>=3);

}
function momentText(s){const honours=[...(s.trophies||[]),...(s.awards||[])];if(honours.length)return honours.slice(0,2).join(' • ')+(honours.length>2?` • +${honours.length-2}`:'');if(s.position===1)return `${s.league} champions`;if(Math.abs(s.ratingChange||0)>=3)return `${s.ratingChange>0?'+':''}${s.ratingChange} OVR`;return `${s.apps} apps • ${s.goals}G ${s.assists}A`}
function routeHtml(){const transfers=state.transfers||[],clubs=[],first=state.history?.[0]?.club||transfers[0]?.from||state.player.club;if(first)clubs.push(first);for(const t of transfers){const club=t.to;if(club&&clubs[clubs.length-1]!==club)clubs.push(club)}return clubs.map((c,i)=>`<span>${i?'→ ':''}${esc(c)}</span>`).join('')||'<span>Career not started</span>'}

renderLegacy=function(){

 const perf=seasonPerformanceIndex(st,s),ucl=s.trophies.includes('Champions League'),world=s.trophies.includes('World Cup'),champ=s.position===1;

 add(`${p.club} Player of the Season`,s.apps>=20&&s.avg>=6.93,v8Prob(.24,s,p,perf*.05),38);
 add(`${p.club} Supporters’ Player of the Season`,s.apps>=22&&s.avg>=6.98,v8Prob(.18,s,p,perf*.04),40);
 add(`${s.league} Young Player of the Season`,p.age<=22&&s.apps>=19&&s.avg>=6.88,v8Prob(.30,s,p,p.age<=20?.08:0),60);
 add(`${s.league} Team of the Season`,s.apps>=23&&s.avg>=6.93,v8Prob(.34,s,p,perf*.07),64);
 add('Golden Boy',p.age<=21&&p.rating>=78&&s.apps>=20&&s.avg>=6.98,v8Prob(.12,s,p,.03),72);
 add(`${s.league} Playmaker Award`,mid&&s.assists>=10&&s.avg>=6.93,clamp(.43+(s.assists-10)*.035, .35,.84),70);
 add(`${s.league} Golden Boot`,attack&&s.goals>=18,clamp(.47+(s.goals-18)*.035,.42,.92),78);
 add(`${s.league} Golden Glove`,p.position==='GK'&&s.apps>=25&&s.avg>=6.95&&s.position<=6,v8Prob(.34,s,p,champ?.08:0),78);
 add(`${s.league} Defender of the Season`,def&&s.apps>=24&&s.avg>=7.00,v8Prob(.17,s,p,perf*.07),80);
 add(`${s.league} Midfielder of the Season`,mid&&s.apps>=24&&s.avg>=7.00,v8Prob(.17,s,p,perf*.07),80);
 add(`${s.league} Player of the Season`,s.apps>=26&&s.avg>=7.07&&p.rating>=75,v8Prob(.12,s,p,perf*.10+(champ?.08:0)),84);
 add('UEFA Champions League Player of the Season',ucl&&s.avg>=7.03,v8Prob(.25,s,p,.10),91);
 add('European Golden Shoe',attack&&s.goals>=27,clamp(.28+(s.goals-27)*.04,.25,.86),92);
 add('Kopa Trophy',p.age<=21&&p.rating>=82&&s.avg>=7.01,v8Prob(.14,s,p,.04),93);
 add('Yashin Trophy',p.position==='GK'&&p.rating>=86&&s.avg>=7.03,v8Prob(.13,s,p,.04),94);
 add('Gerd Müller Trophy',attack&&s.goals>=32,clamp(.24+(s.goals-32)*.045,.22,.88),95);
 const worldXIExtra=(ucl?.10:0)+(world?.15:0)+(champ?.05:0)+(contrib>=30?.07:0);
 add('FIFPRO Men’s World 11',p.rating>=86&&s.apps>=25&&s.avg>=7.02,v8Prob(.13,s,p,worldXIExtra),96);
 const fifaExtra=(ucl?.11:0)+(world?.16:0)+(champ?.05:0)+(contrib>=32?.06:0);
 add('The Best FIFA Men’s Player',p.rating>=88&&s.apps>=25&&s.avg>=7.07,v8Prob(.055,s,p,fifaExtra),98);
 const ballonProb=clamp(.055+Math.max(0,p.rating-86)*.028+Math.max(0,s.avg-7.00)*.42+Math.max(0,contrib-24)*.005+(ucl?.12:0)+(world?.18:0)+(champ?.05:0)+(s.historicSeason?.20:0),.04,.62);
 add("Ballon d'Or",p.rating>=87&&s.apps>=25&&s.avg>=7.03,ballonProb,100);
 const selected=out.sort((a,b)=>b.priority-a.priority).slice(0,5).map(x=>x.name);for(const name of selected)p.career.awards.push({year:st.year,name,club:p.club});return selected;
};
function v8Particles(tier){const n=12+tier*10;return `<div class="flV8Particles">${Array.from({length:n},(_,i)=>`<i style="--x:${(i*47)%96+2}%;--y:${(i*61)%78+8}%;--s:${2+(i%4)}px;--d:${1.5+(i%7)*.23}s;--delay:-${(i%9)*.21}s"></i>`).join('')}</div>`}
function v8CeremonyHtml(s,type='trophy',buttonId='flV8CeremonyContinue',buttonLabel='Continue',itemsOverride=null){
 const items=(itemsOverride||(type==='trophy'?s.trophies:s.awards)||[]).filter(Boolean);if(!items.length)return '';
 const ranked=items.map(name=>({name,tier:v8AwardTier(name,type)})).sort((a,b)=>b.tier-a.tier),main=ranked[0],tier=main.tier,others=ranked.slice(1),isAward=type==='award';
 const descriptor=tier===5?'GLOBAL ICONIC HONOUR':tier===4?'ELITE HONOUR':tier===3?'MAJOR HONOUR':tier===2?'SEASON HONOUR':'CLUB HONOUR';
 const visual=isAward&&/Ballon d'Or/i.test(main.name)?'<div class="flV8BallonBall" aria-hidden="true"></div>':trophyVisual(isAward?'award':'trophy');
 return `<div class="flV8Ceremony" data-tier="${tier}" data-kind="${type}"><div class="flV8Atmosphere"></div><div class="flV8Rays"></div><div class="flV8Orbit"></div>${v8Particles(tier)}<div class="flV8Prestige">${descriptor}</div><div class="flV8Stage"><div class="flV8Pedestal"></div><div class="flV8StageCore">${visual}</div></div><div class="eyebrow">${isAward?'INDIVIDUAL AWARD WON':'TROPHY WON'}</div><h2>${esc(main.name)}</h2><p class="flV8CeremonyLead"><b>${esc(state.player.name)}</b> • ${esc(s.club)} • ${esc(s.label)}</p>${others.length?`<div class="flV8Extras">${others.map(x=>`<span>${isAward?'⭐':'🏆'} ${esc(x.name)}</span>`).join('')}</div>`:''}<button class="primary flV8Continue" id="${buttonId}">${buttonLabel}</button></div>`;
}
function v8CeremonyConfetti(items,type='award'){const tier=Math.max(1,...(items||[]).map(x=>v8AwardTier(x,type)));confetti(tier===5?260:tier===4?190:tier===3?125:tier===2?70:35);return tier}
function v8PresentationSteps(s){
 const steps=[];for(const type of ['trophy','award']){const source=((type==='trophy'?s.trophies:s.awards)||[]).map(name=>({name,tier:v8AwardTier(name,type)})).sort((a,b)=>a.tier-b.tier);const smaller=source.filter(x=>x.tier<=2).map(x=>x.name);if(smaller.length)steps.push({type,items:smaller,tier:Math.max(...smaller.map(x=>v8AwardTier(x,type)))});for(const item of source.filter(x=>x.tier>=3))steps.push({type,items:[item.name],tier:item.tier})}return steps
}
function v8SeasonReviewHtml(s,delta){
 const g=seasonGradeInfo(s.avg),trophies=s.trophies||[],awards=s.awards||[],offerCount=state.pendingOffers?.length||0;
 const honourRows=(items,type)=>items.map(n=>`<div class="flV8HonourRow ${type==='award'?'award':''}"><i>${type==='award'?'⭐':'🏆'}</i><span>${esc(n)}</span></div>`).join('');
 return `<div class="flV8SeasonReview"><div class="flV8ReviewHead"><div class="flV8ReviewKicker">${esc(s.label)} • END OF SEASON REVIEW</div><div class="flV8GradeStage"><div class="flV8GradeLetter">${g.grade}</div><div class="flV8GradeCopy"><b>${esc(g.label)}</b><span>${s.avg.toFixed(2)} average rating across ${s.apps} appearances.</span></div></div><div class="flV8ReviewClub"><strong>${esc(s.club)}</strong> finished ${ordinal(s.position)} in ${esc(s.league)}.</div></div>${scenarioImpactHtml(s)}<div class="flV8ReviewStats"><div><small>APPEARANCES</small><b>${s.apps}</b></div><div><small>GOALS</small><b>${s.goals}</b></div><div><small>ASSISTS</small><b>${s.assists}</b></div><div><small>OVR CHANGE</small><b>${delta>0?'+':''}${delta}</b></div><div><small>FINAL OVR</small><b>${state.player.rating}</b></div><div><small>POTENTIAL</small><b>${s.endPotential??state.player.potential}</b></div><div><small>LEAGUE FINISH</small><b>${ordinal(s.position)}</b></div><div><small>TRANSFER OFFERS</small><b>${offerCount}</b></div></div>${trophies.length?`<div class="flV8HonourSection"><small>TROPHIES WON</small><div class="flV8HonourList">${honourRows(trophies,'trophy')}</div></div>`:''}${awards.length?`<div class="flV8HonourSection"><small>INDIVIDUAL HONOURS</small><div class="flV8HonourList">${honourRows(awards,'award')}</div></div>`:''}<div class="flV8ReviewOffer">${offerCount?`<b>${offerCount} transfer offer${offerCount===1?'':'s'}</b> waiting at the start of your next season.`:'No transfer offer is waiting yet.'}</div><button class="primary quickMainAction" id="seasonContinue" style="margin-top:14px">Back to Play Career</button></div>`;
};
function runV8Presentation(s,delta,onDone){
 const steps=v8PresentationSteps(s);
 let i=0;const review=()=>{document.body.classList.remove('quick-award-open');const c=document.getElementById('confetti');if(c)c.innerHTML='';showModal(v8SeasonReviewHtml(s,delta));document.getElementById('seasonContinue').onclick=()=>{closeModal();onDone?.()}};
 const next=()=>{if(i>=steps.length)return review();const step=steps[i++],type=step.type,id=`flV8Continue-${type}-${i}`;document.body.classList.toggle('quick-award-open',type==='award');showModal(v8CeremonyHtml(s,type,id,i<steps.length?'Continue to Next Honour':'Continue to Season Review',step.items));v8CeremonyConfetti(step.items,type);document.getElementById(id).onclick=next};next();
}
playSeasonUI=function(choice){if(state?.mode!=='story')return V7PlaySeasonUI(choice);const before=state.player.rating,s=simulateSeason(state,choice);if(!s)return renderAll();state.storyDecisionReady=null;save();activeTab='journey';renderAll();const delta=state.player.rating-before;runV8Presentation(s,delta,()=>window.FL_QUICK_V5?.returnToPlay?.())};
window.FL_QUICK_V8={awardTier:v8AwardTier,ceremonyHtml:v8CeremonyHtml,ceremonyConfetti:v8CeremonyConfetti,presentationSteps:v8PresentationSteps,runPresentation:runV8Presentation,reviewHtml:v8SeasonReviewHtml};
})();
