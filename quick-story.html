<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110c">
<title>Football Legacy — Quick Story</title>
<style>
*{box-sizing:border-box}:root{--bg:#050b08;--panel:#0c1812;--panel2:#10221a;--text:#f4fff8;--muted:#9ab0a2;--line:rgba(236,255,243,.10);--accent:#6df3aa;--accent2:#32c97d;--gold:#ffd96c;--blue:#80c5ff;--violet:#a693ff;--red:#ff8190;--shadow:0 22px 70px rgba(0,0,0,.32);--radius:28px;--mode:#6df3aa;--mode2:#32c97d}
html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% -8%,rgba(109,243,170,.13),transparent 28%),radial-gradient(circle at 100% 18%,rgba(128,197,255,.09),transparent 27%),linear-gradient(180deg,#050b08,#07130d 48%,#050b08);overflow-x:hidden}body[data-mode="original"]{--mode:#6df3aa;--mode2:#32c97d}body[data-mode="express"]{--mode:#94e7b9;--mode2:#5fc48d;background:radial-gradient(circle at 9% -8%,rgba(109,243,170,.10),transparent 28%),radial-gradient(circle at 100% 18%,rgba(128,197,255,.08),transparent 27%),linear-gradient(180deg,#06100c,#0a1711 48%,#060e0a)}body[data-mode="story"]{--mode:#9ebfff;--mode2:#8f79ff;background:radial-gradient(circle at 5% -5%,rgba(142,121,255,.15),transparent 30%),radial-gradient(circle at 100% 20%,rgba(92,171,255,.12),transparent 30%),linear-gradient(180deg,#070b13,#091321 50%,#060a11)}
button,select{font:inherit}button{border:0;cursor:pointer;min-height:46px;padding:12px 16px;border-radius:16px;font-weight:900;transition:transform .16s ease,filter .16s ease,border-color .16s ease}button:active{transform:scale(.97)}button:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--mode) 55%,transparent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{color:#04160d;background:linear-gradient(135deg,var(--mode),var(--mode2));box-shadow:0 12px 28px color-mix(in srgb,var(--mode) 20%,transparent)}.secondary{color:var(--text);background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.075)}.gold{color:#211600;background:linear-gradient(135deg,#ffe58d,#efb840)}.danger{color:#ffe0e4;background:rgba(190,60,77,.28);border:1px solid rgba(255,129,144,.18)}
.app{width:min(100%,1080px);margin:auto;padding:14px 14px 88px}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 13px}.brand{display:flex;gap:10px;align-items:center;font-weight:1000;letter-spacing:-.025em}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#04160d;background:linear-gradient(145deg,#84f7b8,#d8ffe7);box-shadow:0 10px 30px rgba(59,211,132,.2)}.topActions{display:flex;gap:8px}.iconBtn{width:44px;padding:0}.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(155deg,rgba(17,34,25,.95),rgba(7,17,12,.96));box-shadow:var(--shadow)}body[data-mode="story"] .panel{background:linear-gradient(155deg,rgba(18,28,49,.96),rgba(7,14,26,.97))}body[data-mode="express"] .panel{background:linear-gradient(155deg,rgba(16,31,24,.96),rgba(7,15,12,.98))}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mode);font-weight:950}.muted,.subline{color:var(--muted);line-height:1.48}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill,.modeBadge,.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055)}.modeBadge{color:var(--mode);border-color:color-mix(in srgb,var(--mode) 30%,transparent);background:color-mix(in srgb,var(--mode) 10%,transparent)}
/* landing */
.landingHero{position:relative;overflow:hidden;padding:clamp(21px,5vw,42px)}.landingHero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-120px;border:1px solid rgba(109,243,170,.12);box-shadow:0 0 0 40px rgba(109,243,170,.025),0 0 0 85px rgba(109,243,170,.015)}.landingHero h1{font-size:clamp(42px,10vw,78px);line-height:.93;letter-spacing:-.07em;margin:10px 0 14px;max-width:800px}.landingHero p{max-width:720px;font-size:clamp(14px,2vw,18px);margin:0}.stadium{height:205px;margin:25px 0 10px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:25px;background:linear-gradient(180deg,#08120d 0 41%,#10271b 41% 47%,#18784a 47%)}.stands{position:absolute;inset:9px 8px 85px;background:repeating-linear-gradient(90deg,#14231b 0 10px,#20392b 10px 14px);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);border-radius:18px}.lights{position:absolute;top:15px;left:10%;right:10%;height:8px;background:radial-gradient(circle,#ffffe8 0 2px,transparent 3px) 0 0/27px 8px repeat-x;filter:drop-shadow(0 0 8px rgba(255,255,220,.75))}.pitch{position:absolute;left:5%;right:5%;bottom:-31px;height:123px;background:repeating-linear-gradient(90deg,#23895a 0 46px,#1c7a50 46px 92px);transform:perspective(260px) rotateX(20deg);border:2px solid rgba(255,255,255,.55)}.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.6)}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;border:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}.modeIntro{padding:25px 4px 10px}.modeIntro h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.045em;margin:4px 0 7px}.modeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.modeCard{position:relative;overflow:hidden;padding:20px;min-width:0}.modeCard:before{content:"";position:absolute;right:-55px;top:-55px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--cardAccent),transparent 68%);opacity:.17}.modeCard.original{--cardAccent:#6df3aa}.modeCard.express{--cardAccent:#9ceabf}.modeCard.story{--cardAccent:#9f8cff}.modeCard.recommended{border-color:rgba(109,243,170,.32);box-shadow:0 20px 65px rgba(50,201,125,.12)}.recommend{position:absolute;right:12px;top:12px;font-size:9px;font-weight:1000;letter-spacing:.1em;padding:6px 8px;border-radius:999px;color:#06170d;background:#75efac}.modeIcon{font-size:36px;margin:3px 0 11px}.modeCard h3{font-size:23px;margin:0 0 4px;letter-spacing:-.04em}.modeTime{font-size:12px;font-weight:900;color:var(--cardAccent);margin-bottom:12px}.featureList{display:grid;gap:8px;margin:14px 0 18px}.feature{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;color:#d5e5da;font-size:12px;line-height:1.38}.feature span:first-child{color:var(--cardAccent);font-weight:1000}.modeCard button{width:100%}.dailyRow{margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035)}.resume{margin-top:14px;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.resume strong{display:block}.resume small{display:block;color:var(--muted);margin-top:4px}
/* reveal */
.playerReveal{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center;margin:17px 0}.bigOvr{aspect-ratio:1;border-radius:30px;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--mode) 23%,transparent),rgba(255,255,255,.035));border:1px solid color-mix(in srgb,var(--mode) 30%,transparent)}.bigOvr strong{font-size:52px;line-height:1;color:var(--mode)}.bigOvr small{font-size:9px;letter-spacing:.13em;color:var(--muted);font-weight:900}.revealInfo h3{font-size:25px;margin:4px 0 9px}.pillRow{display:flex;gap:6px;flex-wrap:wrap}
/* game shell */
.gameHead{position:sticky;top:7px;z-index:30;padding:11px 13px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;backdrop-filter:blur(18px);background:rgba(7,18,12,.87);margin-bottom:9px}body[data-mode="story"] .gameHead{background:rgba(8,15,27,.88)}body[data-mode="express"] .gameHead{background:rgba(7,18,12,.88)}.crest{width:51px;height:51px;display:grid;place-items:center;border-radius:17px;font-size:13px;font-weight:1000;letter-spacing:-.04em;background:linear-gradient(145deg,color-mix(in srgb,var(--mode) 22%,#14201a),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 24%,transparent)}.playerTitle{min-width:0}.playerTitle strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerTitle small{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headRight{display:flex;align-items:center;gap:8px}.headMode{display:block;text-align:right;font-size:9px;font-weight:1000;letter-spacing:.08em;color:var(--mode);margin-bottom:3px}.ovrBox{text-align:center}.ovrBox strong{display:block;color:var(--gold);font-size:27px;line-height:1}.ovrBox small{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.1em}.tabs{position:sticky;top:80px;z-index:29;display:flex;gap:5px;padding:5px;margin-bottom:10px;backdrop-filter:blur(18px);background:rgba(7,18,12,.88);overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}body[data-mode="story"] .tabs{background:rgba(8,15,27,.88)}body[data-mode="express"] .tabs{background:rgba(7,18,12,.88)}.tab{padding:9px 6px;background:transparent;color:var(--muted);flex:1 0 110px;min-width:0}.tab.active{color:var(--text);background:color-mix(in srgb,var(--mode) 12%,transparent);border:1px solid color-mix(in srgb,var(--mode) 20%,transparent)}.screen{display:none}.screen.active{display:block}.gameModeBanner{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;margin-bottom:9px;border-radius:20px;background:linear-gradient(90deg,color-mix(in srgb,var(--mode) 12%,transparent),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 17%,transparent)}.gameModeBanner b{font-size:12px}.gameModeBanner small{color:var(--muted);font-size:10px}
/* journey */
.journeyHero{position:relative;overflow:hidden;padding:22px;margin-bottom:10px;background:radial-gradient(circle at 92% 12%,color-mix(in srgb,var(--mode) 17%,transparent),transparent 34%),linear-gradient(155deg,rgba(18,37,27,.96),rgba(7,18,12,.97))}body[data-mode="story"] .journeyHero{background:radial-gradient(circle at 92% 12%,rgba(146,127,255,.18),transparent 35%),linear-gradient(155deg,rgba(19,31,54,.98),rgba(7,14,27,.98))}body[data-mode="story"] .journeyHero{background:radial-gradient(circle at 90% 10%,rgba(255,217,108,.20),transparent 34%),linear-gradient(155deg,#242016,#0d0d0a)}.journeyHero h2{font-size:clamp(30px,6vw,46px);letter-spacing:-.055em;margin:6px 0}.seasonKicker{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}.progress i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--mode2),var(--mode))}.statGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.042);border:1px solid rgba(255,255,255,.05);min-width:0}.stat small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.stat strong{font-size:19px;overflow-wrap:anywhere}.nextAction{margin-top:14px}.nextAction button{width:100%;min-height:58px;font-size:16px}.clubSpotlight{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin:10px 0}.clubCard,.attributePanel,.feedPanel,.seasonCard,.marketHero,.legacyHero{padding:18px}.clubIdentity{display:flex;gap:12px;align-items:center}.clubIdentity .crest{width:62px;height:62px;border-radius:21px;font-size:15px}.clubIdentity h3{margin:2px 0 4px;font-size:20px}.metricRows{display:grid;gap:8px;margin-top:14px}.metricRow{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:12px}.metricRow span{color:var(--muted)}.attributeMini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.miniAttr{padding:10px;border-radius:15px;background:rgba(255,255,255,.04)}.miniAttrTop{display:flex;justify-content:space-between;gap:7px;font-size:11px}.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--mode2),var(--mode))}.storyCallout{padding:17px;margin:10px 0;border-radius:23px;background:linear-gradient(135deg,color-mix(in srgb,var(--mode) 11%,transparent),rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--mode) 20%,transparent)}.storyCallout h3{font-size:20px;margin:4px 0 7px}.storyContext{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{color:#fff;text-align:left;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.06);padding:12px}.choice small{display:block;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.35}.seasonTop{display:flex;justify-content:space-between;gap:12px}.grade{width:63px;height:63px;border-radius:21px;display:grid;place-items:center;flex:0 0 63px;font-size:24px;font-weight:1000;color:var(--gold);background:rgba(255,217,108,.10);border:1px solid rgba(255,217,108,.25)}.resultStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.resultStrip div{padding:9px;border-radius:14px;background:rgba(255,255,255,.04);text-align:center}.resultStrip small{display:block;color:var(--muted);font-size:9px}.resultStrip strong{font-size:17px}.awardList{display:flex;gap:7px;flex-wrap:wrap}.trophyBadge{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;padding:9px 11px;border-radius:15px;color:#2a1a00;font-size:11px;font-weight:1000;background:linear-gradient(135deg,#fff0a7,#f3b83e);box-shadow:0 8px 24px rgba(241,184,62,.15)}body[data-mode="story"] .trophyBadge{padding:11px 13px;font-size:12px;box-shadow:0 0 24px rgba(255,209,86,.22)}.awardBadge{display:inline-flex;gap:6px;align-items:center;padding:9px 11px;border-radius:15px;color:#e9e2ff;font-size:11px;font-weight:1000;background:rgba(159,140,255,.14);border:1px solid rgba(159,140,255,.2)}.reel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.moment{min-height:108px;padding:12px;border-radius:18px;background:rgba(255,255,255,.037);border:1px solid rgba(255,255,255,.05)}.moment .mIcon{font-size:23px}.moment b{display:block;font-size:12px;margin:7px 0 4px}.moment small{color:var(--muted);font-size:10px;line-height:1.4}.feed{display:grid}.feedItem{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06)}.feedIcon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05)}.feedItem b{font-size:12px}.feedItem small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:3px}
/* player */
.playerHero{padding:20px;margin-bottom:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:15px;align-items:center}.playerHero .bigOvr{width:118px}.playerHero h2{font-size:30px;letter-spacing:-.045em;margin:4px 0}.attributeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}.attribute{padding:12px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}.attributeTop{display:flex;align-items:end;justify-content:space-between;gap:8px}.attributeTop span{font-size:10px;color:var(--muted);font-weight:900}.attributeTop strong{font-size:22px}.profileGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profileCard{padding:17px}.profileCard h3{margin:4px 0 7px}
/* market */
.marketHero h2,.legacyHero h2{font-size:31px;letter-spacing:-.045em;margin:5px 0}.stayCard{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.offerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.offer{padding:17px}.offerHeader{display:flex;gap:11px;align-items:center}.offerHeader h3{margin:2px 0;font-size:19px}.compare{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:stretch;margin:13px 0}.compareClub{padding:11px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}.compareClub.target{border-color:color-mix(in srgb,var(--mode) 22%,transparent);background:color-mix(in srgb,var(--mode) 7%,transparent)}.compareClub b{font-size:11px}.compareClub small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.versus{display:grid;place-items:center;color:var(--muted);font-weight:1000;font-size:10px}.fit{padding:11px;border-radius:17px;background:color-mix(in srgb,var(--mode) 8%,transparent);border:1px solid color-mix(in srgb,var(--mode) 16%,transparent);margin:10px 0}.fitTop{display:flex;justify-content:space-between;gap:10px}.fit strong{color:var(--mode)}
/* legacy */
.legacyScore{display:flex;gap:15px;align-items:center;margin-top:15px}.scoreRing{width:108px;height:108px;border-radius:34px;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--mode) calc(var(--score)*1%),rgba(255,255,255,.07) 0);position:relative}.scoreRing:after{content:"";position:absolute;inset:7px;border-radius:29px;background:#0d1b14}body[data-mode="story"] .scoreRing:after{background:#10192b}body[data-mode="story"] .scoreRing:after{background:#19160f}.scoreRing strong,.scoreRing small{position:relative;z-index:1}.scoreRing strong{font-size:34px}.scoreRing small{font-size:8px;color:var(--muted);font-weight:900}.timeline{display:grid}.timelineRow{display:grid;grid-template-columns:68px 40px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.055)}.year{font-size:10px;color:var(--muted)}.miniCrest{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.055);font-size:9px;font-weight:1000}.timelineRow b{font-size:11px}.timelineRow small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.seasonOvr{font-size:17px;font-weight:1000;color:var(--gold)}.chart{width:100%;height:auto;margin-top:15px}.chart text{fill:var(--muted);font-size:10px}.chart .line{fill:none;stroke:var(--mode);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:color-mix(in srgb,var(--mode) 9%,transparent)}.chart .gridline{stroke:rgba(255,255,255,.09)}.careerEnd{text-align:center;padding:25px;margin-top:10px}.careerEnd .scoreRing{margin:15px auto}.shareText{text-align:left;white-space:pre-wrap;padding:12px;border-radius:16px;background:rgba(0,0,0,.18);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:13px 0}.empty{padding:28px 15px;text-align:center;color:var(--muted)}
/* modal / celebration */

function playerMarketValue(st,s){const p=st.player,upside=Math.max(0,p.potential-p.rating),form=clamp(1+(s.avg-6.75)*.16,.82,1.22),output=['ST','WG','AM'].includes(p.position)?clamp(1+Math.max(0,s.goals+s.assists-20)*.006,1,1.15):1,rep=clamp(.88+p.reputation/380,.88,1.14);let v=ratingBaseValue(p.rating)*ageValueMultiplier(p.age)*(1+Math.min(.42,upside*.024))*form*output*rep;return Math.max(250000,Math.round(v/100000)*100000)}
function clubTransferBudget(club,year=2026){const cp=clubProfile(club),rep=cp.rep;let m=rep>=96?210:rep>=93?165:rep>=90?125:rep>=86?88:rep>=82?62:rep>=78?43:rep>=73?29:rep>=68?19:rep>=62?11:rep>=56?6:3.2;const countryMult={England:1.16,Spain:1.00,Germany:1.02,Italy:.92,France:.93,Portugal:.68,Netherlands:.64,Scotland:.52,Belgium:.55,Turkey:.62,Austria:.48,Switzerland:.48,Denmark:.45,Norway:.43,Sweden:.43,Greece:.45,Poland:.43,Czechia:.40,Croatia:.38}[cp.country]||.62;const tierMult=cp.tier===1?1:cp.tier===2?.52:cp.tier===3?.28:.18,season=.84+(hash(club+'-'+year)%33)/100;return Math.round(m*1e6*countryMult*tierMult*season/100000)*100000}
function financialLabel(budget){if(budget>=120e6)return 'Elite spending power';if(budget>=65e6)return 'Very strong';if(budget>=30e6)return 'Strong';if(budget>=12e6)return 'Moderate';return 'Limited'}
function transferInterestReason(st,s,club,role){const p=st.player;if(p.age<=22&&p.potential>=p.rating+7)return 'Long-term upside and development potential';if(['ST','WG','AM'].includes(p.position)&&s.goals+s.assists>=25)return 'Outstanding attacking production this season';if(s.avg>=7.25)return 'Consistently high match performances';if(role==='Star Player')return 'Immediate first-team impact';if(p.captain&&p.age>=27)return 'Experience and leadership';return 'A realistic fit for the squad’s current level'}
function isReserveClub(name){return /(^Jong | B$| Futures$|^Club NXT$)/.test(name)}
function generateOffers(st,s,interestMod=0){const p=st.player;if(p.age>=34)return [];const current=clubProfile(p.club),perf=seasonPerformanceIndex(st,s),marketValue=playerMarketValue(st,s),base=.085+Math.max(0,p.rating-58)*.018+Math.max(0,s.avg-6.65)*.20+Math.max(0,perf)*.055+interestMod;if(!chance(st,clamp(base,.05,.76)))return [];let candidates=ALL_CLUBS.filter(x=>x.club!==p.club);if(p.age<18)candidates=candidates.filter(x=>x.country===current.country);const strongSeason=perf>=.85,eliteSeason=perf>=1.55,ambition=current.rep+(eliteSeason?10:strongSeason?6:2)+(p.age<=23&&p.potential>=84?3:0);candidates=candidates.filter(x=>{if(isReserveClub(x.club)&&p.age>22)return false;const rep=clubRep(x.club),level=squadLevel(x.club),gap=p.rating-level,budget=clubTransferBudget(x.club,st.year+1),need=(hash(x.club+'-'+p.position+'-'+(st.year+1))%100);if(budget<marketValue*.92)return false;if(need<23)return false;if(rep<current.rep-7||rep>Math.min(98,ambition+5))return false;if(gap<-9||gap>12)return false;if(rep>=95&&p.rating<80&&!(p.age<=22&&p.potential>=90&&eliteSeason))return false;if(rep>=90&&p.rating<75&&!(p.age<=21&&p.potential>=86&&strongSeason))return false;return true});if(!candidates.length)candidates=ALL_CLUBS.filter(x=>{if(x.club===p.club||(p.age<18&&x.country!==current.country)||(isReserveClub(x.club)&&p.age>22))return false;const budget=clubTransferBudget(x.club,st.year+1),rep=clubRep(x.club),gap=p.rating-squadLevel(x.club);return budget>=marketValue*.92&&rep>=current.rep-5&&rep<=Math.min(98,ambition+3)&&gap>=-7&&gap<=10});const scored=candidates.map(x=>{const rep=clubRep(x.club),level=squadLevel(x.club),need=(hash(x.club+'-'+p.position+'-'+(st.year+1))%100)/100,targetRep=clamp(ambition,48,98);return {...x,score:Math.abs(rep-targetRep)*1.05+Math.abs((p.rating-level)-1.5)*.8+(1-need)*3+rand(st)*3.2}}).sort((a,b)=>a.score-b.score);const count=st.mode==='original'?(chance(st,.55)?2:1):(st.mode==='express'?(chance(st,.24)?2:1):1),offers=[];for(const x of scored){if(offers.length>=count)break;if(offers.some(o=>o.club===x.club))continue;const budget=clubTransferBudget(x.club,st.year+1),negotiation=.94+rand(st)*.16,fee=Math.round(marketValue*negotiation/100000)*100000;if(fee>budget*.92)continue;const fake={...st,player:{...p,club:x.club}},role=roleAtClub(fake,x.club),fit=transferFitScore(st,x.club);offers.push({club:x.club,country:x.country,division:x.division,rep:clubRep(x.club),squad:squadLevel(x.club),fee,budget,feePct:Math.round(fee/budget*100),finance:financialLabel(budget),reason:transferInterestReason(st,s,x.club,role),role,fit,currency:'£'})}return offers}
function acceptOffer(st,index){const o=st.pendingOffers[index];if(!o)return false;const from=st.player.club;st.player.club=o.club;st.player.clubYears=0;st.player.captain=false;st.transfers.push({year:st.year,from,to:o.club,fee:o.fee,type:'Transfer'});st.news.unshift({icon:'✈️',title:'Transfer complete',text:`${st.player.name} leaves ${from} for ${o.club} in a ${money(o.fee,o.currency||'£')} move.`});st.pendingOffers=[];st.pendingStory=null;return true}
function stayPut(st){if(st.pendingOffers.length)st.news.unshift({icon:'🤝',title:'Staying put',text:`${st.player.name} turns down interest to remain at ${st.player.club}.`});st.pendingOffers=[]}
function shouldRetire(st){const p=st.player;return p.age>=p.retirementAge||(p.age>=34&&p.rating<=55&&chance(st,.28))}
function simulateSeason(st,storyChoiceIndex=null){if(st.ended||st.pendingOffers.length)return null;let mod={};if(st.pendingStory)mod=storyModifier(st,storyChoiceIndex==null?1:storyChoiceIndex);const p=st.player,league=leagueForClub(p.club);if(!league)throw new Error('No league for '+p.club);const role=roleAtClub(st),ranges={'Star Player':[34,43],'Regular Starter':[28,40],'Rotation Player':[15,31],'Prospect':[5,21]},ar=ranges[role];let apps=clamp(rint(st,ar[0],ar[1])+(mod.apps||0),1,48);if(p.age>=33)apps=Math.max(8,apps-rint(st,0,5));const level=squadLevel(p.club),talent=(p.rating-level)/18,variance=Math.max(-.12,mod.variance||0),perfBase=6.58+talent*.22+(mod.perf||0)+gaussian(st)*(.18+Math.max(0,variance));const rate=POSITION_RATES[p.position],minutes=apps/38,quality=clamp(.72+(p.rating-55)/70,.58,1.35),form=clamp(.88+(perfBase-6.5)*.22,.72,1.18);let goals=Math.max(0,Math.round(38*rate.g*minutes*quality*form*(.72+rand(st)*.56))),assists=Math.max(0,Math.round(38*rate.a*minutes*quality*form*(.72+rand(st)*.56)));if(p.position==='GK'){goals=chance(st,.012)?1:0;assists=chance(st,.07)?1:0}let avg=clamp(perfBase+(goals+assists)/Math.max(20,apps)*.16,5.75,8.45);avg=+avg.toFixed(2);const position=teamFinish(st,league,avg),s={label:currentSeasonLabel(st),year:st.year,club:p.club,league:league.name,role,apps,goals,assists,avg,position,startRating:p.rating,trophies:[],awards:[],caps:0,intGoals:0,story:mod.storyText||null};
 p.career.apps+=apps;p.career.goals+=goals;p.career.assists+=assists;p.clubYears++;s.trophies=maybeTrophies(st,s);s.awards=maybeAwards(st,s);const intl=internationalSeason(st,s);s.caps=intl.caps;s.intGoals=intl.goals;if(intl.trophy)s.trophies.push(intl.trophy);s.ratingChange=development(st,s,mod);p.reputation=clamp(p.reputation+Math.round((avg-6.6)*7+s.trophies.length*4+s.awards.length*5+(mod.rep||0)),5,100);if(!p.captain&&p.age>=26&&p.clubYears>=3&&p.rating>=level+3&&chance(st,.20)){p.captain=true;st.news.unshift({icon:'©️',title:'Named captain',text:`${p.club} hand ${p.name} the captain's armband.`})}s.moments=generateSeasonMoments(st,s);st.history.push(s);st.lastSeason=s;st.news.unshift({icon:s.position===1?'🏆':'📊',title:`${s.label} complete`,text:`${p.club}: ${ordinal(position)} • ${apps} apps • ${goals} goals • ${assists} assists • ${avg.toFixed(2)} avg.`});st.news=st.news.slice(0,14);p.age++;st.year++;st.pendingOffers=generateOffers(st,s,mod.interest||0);if(shouldRetire(st)){st.ended=true;st.pendingOffers=[];st.pendingStory=null;st.news.unshift({icon:'🏟️',title:'A career closes',text:`${p.name} retires at age ${p.age} after ${st.history.length} professional seasons.`})}else if(!st.pendingOffers.length)maybeStory(st);return s}
function careerScore(st){const p=st.player,c=p.career,ballons=c.awards.filter(x=>x.name==="Ballon d'Or").length,major=c.trophies.filter(x=>['Champions League','World Cup'].includes(x.name)).length;let score=8+(p.peak-55)*.92+Math.min(18,c.apps/42)+Math.min(12,(c.goals+c.assists)/45)+Math.min(16,c.trophies.length*2.3+major*3.2)+Math.min(18,c.awards.length*2.3+ballons*5)+Math.min(8,c.caps/13);return clamp(Math.round(score),0,100)}
function legacyLabel(score){if(score>=96)return 'Immortal';if(score>=90)return 'All-Time Great';if(score>=82)return 'World Class';if(score>=72)return 'Elite Career';if(score>=60)return 'Top Professional';if(score>=48)return 'Respected Pro';return 'Journeyman'}
function seasonGrade(avg){if(avg>=7.7)return 'A+';if(avg>=7.45)return 'A';if(avg>=7.2)return 'A−';if(avg>=6.95)return 'B+';if(avg>=6.75)return 'B';if(avg>=6.55)return 'B−';if(avg>=6.35)return 'C';return 'D'}
function shareSummary(st){const p=st.player,c=p.career,score=careerScore(st),ballons=c.awards.filter(x=>x.name==="Ballon d'Or").length;return `FOOTBALL LEGACY — ${score}/100 (${legacyLabel(score)})\n${modeInfo(st.mode).icon} ${modeInfo(st.mode).name} Mode\n${p.name} • ${p.nationality} • ${POS_LABEL[p.position]}\n${st.history.length} seasons • Peak ${p.peak} OVR\n${c.apps} apps • ${c.goals} goals • ${c.assists} assists\n🏆 ${c.trophies.length} trophies • ⭐ ${c.awards.length} awards${ballons?` • ${ballons} Ballon d'Or`:''}\nClubs: ${[...new Set(st.transfers.map(x=>x.to))].join(' → ')}\nSeed: ${st.seed}`}
function save(){if(!state)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s?.player)return null;if(s.version===1||s.version===2||s.version===3){s.version=4;if(s.mode==='career')s.mode='express';if(s.mode==='quick')s.mode='express';s.mode=MODE_INFO[s.mode]?s.mode:'express';normalizeAttributes(s.player);if(typeof s.player.potential!=='number')s.player.potential=Math.max(s.player.rating,75);s.pendingOffers=[]}if(s.version!==4)return null;normalizeAttributes(s.player);s.player.potential=clamp(Math.max(s.player.rating,s.player.potential||s.player.rating),50,99);return s}catch(e){return null}}

function finiteTree(x,path='root'){if(typeof x==='number'&&!Number.isFinite(x))throw new Error('Non-finite number at '+path);if(Array.isArray(x))x.forEach((v,i)=>finiteTree(v,path+'['+i+']'));else if(x&&typeof x==='object')for(const [k,v] of Object.entries(x))finiteTree(v,path+'.'+k)}
function autoCareer(seed,mode='express'){const st=createCareer(seed,mode);let guard=0;while(!st.ended&&guard++<30){if(st.pendingOffers.length){const best=st.pendingOffers.map((o,i)=>({o,i})).sort((a,b)=>b.o.fit-a.o.fit)[0];if(best?.o.fit>=66)acceptOffer(st,best.i);else stayPut(st)}if(st.pendingStory)simulateSeason(st,1);else simulateSeason(st,null)}if(!st.ended)throw new Error('Career failed to retire: '+seed);finiteTree(st);return st}
function runInternalTests(count=1800){const start=performance.now(),fail=[],stats={careers:0,seasons:0,byMode:{original:0,express:0,story:0},captainTransfersChecked:0,under18IntlOffers:0,overBudgetOffers:0,peak90:0,ballon:0,major:0,transfers:0,scores:[]};const assert=(c,m)=>{if(!c)throw new Error(m)};try{for(const mode of Object.keys(MODE_INFO)){const a=createCareer('DET-'+mode,mode),b=createCareer('DET-'+mode,mode);assert(JSON.stringify(a.player)===JSON.stringify(b.player),'Non-deterministic '+mode);assert(a.mode===mode,'Mode lost');assert(Object.keys(a.player.attributes).length>=6,'Attributes missing')}
 const dyn=createCareer('DYNAMIC-POTENTIAL-CHECK','express');dyn.player.position='ST';dyn.player.age=23;dyn.player.rating=75;dyn.player.potential=75;dyn.player.growth=1;dyn.player.attributes=deriveAttributes(dyn,75,'ST');const ds={label:'test',year:dyn.year,club:dyn.player.club,league:leagueForClub(dyn.player.club).name,role:'Regular Starter',apps:36,goals:18,assists:9,avg:7.18,position:4,startRating:75,trophies:[],awards:[]};const dd=development(dyn,ds,{});assert(dd>=1,'Excellent 75 OVR / 75 potential season failed to improve');assert(dyn.player.potential>=75,'Dynamic potential regressed');
 for(let i=0;i<count;i++){const mode=['original','express','story'][i%3],st=createCareer('TEST-'+i,mode);let guard=0;while(!st.ended&&guard++<30){if(st.pendingOffers.length){for(const o of st.pendingOffers){if(st.player.age<18&&o.country!==clubInfo(st.player.club)?.country)stats.under18IntlOffers++;if(o.fee>(o.budget||0)*.921)stats.overBudgetOffers++}const wasCaptain=st.player.captain,best=st.pendingOffers.map((o,j)=>({o,j})).sort((a,b)=>b.o.fit-a.o.fit)[0];if(best&&best.o.fit>=68){acceptOffer(st,best.j);if(wasCaptain){stats.captainTransfersChecked++;assert(st.player.captain===false,'Captaincy carried transfer')}}else stayPut(st)}simulateSeason(st,st.pendingStory?1:null)}assert(st.ended,'No retirement');finiteTree(st);const p=st.player,c=p.career,score=careerScore(st);stats.careers++;stats.byMode[mode]++;stats.seasons+=st.history.length;stats.transfers+=Math.max(0,st.transfers.length-1);stats.scores.push(score);if(p.peak>=90)stats.peak90++;if(c.awards.some(x=>x.name==="Ballon d'Or"))stats.ballon++;if(c.trophies.some(x=>['Champions League','World Cup'].includes(x.name)))stats.major++;assert(st.history.length>=14&&st.history.length<=25,'Career length '+st.history.length);assert(p.age>=34&&p.age<=40,'Retire age '+p.age);assert(p.rating>=42&&p.rating<=99,'Rating');assert(p.potential>=p.rating&&p.potential<=99,'Potential invalid');for(const s of st.history){assert(s.apps>=1&&s.apps<=48,'Apps');assert(s.avg>=5.75&&s.avg<=8.45,'Avg');assert(s.position>=1&&s.position<=leagueForClub(s.club).clubs.length,'Position')}}assert(stats.under18IntlOffers===0,'Under-18 international transfer generated');assert(stats.overBudgetOffers===0,'Over-budget transfer generated');const avgScore=stats.scores.reduce((a,b)=>a+b,0)/stats.scores.length;stats.avgScore=avgScore;stats.avgSeasons=stats.seasons/stats.careers;stats.avgTransfers=stats.transfers/stats.careers;stats.peak90Rate=stats.peak90/stats.careers;stats.ballonRate=stats.ballon/stats.careers;stats.majorRate=stats.major/stats.careers;assert(stats.peak90Rate>.003&&stats.peak90Rate<.20,'90+ rarity');assert(stats.ballonRate<.08,'Ballon too common');assert(stats.avgTransfers>.35&&stats.avgTransfers<7,'Transfer rate');assert(avgScore>38&&avgScore<84,'Score dist')}catch(e){fail.push(e.stack||String(e))}stats.ms=Math.round(performance.now()-start);return {ok:!fail.length,fail,stats}}
window.FL_TEST={createCareer,simulateSeason,autoCareer,runInternalTests,careerScore,generateOffers,scenarioPool,seasonPerformanceIndex,playerMarketValue,clubTransferBudget,development};

/* Quick Story match-by-match calendar */
const QUICK_MONTHS=['August','September','October','November','December','January','February','March','April','May'];
function quickSeedValue(s){let h=2166136261>>>0;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function quickSeeded(seed){let x=quickSeedValue(seed)||1;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}
function quickCalendarBuild(season){if(!season||season.matchCalendar)return season?.matchCalendar||[];const r=quickSeeded(`${season.label}|${season.club}|${season.apps}|${season.goals}|${season.assists}`),league=leagueForClub(season.club),opps=(league?.clubs||[]).filter(x=>x!==season.club);const total=Math.max(34,Math.min(42,Math.max(season.apps,38))),playedCount=Math.min(total,season.apps),played=new Set();while(played.size<playedCount)played.add(Math.floor(r()*total));const matches=[];for(let i=0;i<total;i++){const month=Math.min(9,Math.floor(i*10/total)),slot=i-Math.floor(month*total/10),home=r()>.48,opp=opps[Math.floor(r()*opps.length)]||'League Opponent',strength=(season.avg-6.65)*.55+(10-season.position)*.018;let gf=Math.max(0,Math.min(5,Math.round(1.25+strength+(r()-.5)*2.4))),ga=Math.max(0,Math.min(5,Math.round(1.2-strength*.35+(r()-.5)*2.2)));matches.push({month,day:Math.min(28,3+(slot%4)*7),home,opponent:opp,played:played.has(i),gf,ga,userGoals:0,userAssists:0})}const slots=[...played];for(let n=0;n<season.goals;n++){const m=matches[slots[Math.floor(r()*slots.length)]];m.userGoals++;m.gf=Math.max(m.gf,m.userGoals)}for(let n=0;n<season.assists;n++){const m=matches[slots[Math.floor(r()*slots.length)]];m.userAssists++;m.gf=Math.max(m.gf,Math.min(5,m.userGoals+(m.userAssists?1:0)))}for(const m of matches)m.result=m.gf>m.ga?'W':m.gf<m.ga?'L':'D';season.matchCalendar=matches;return matches}
function quickPreviewCalendar(){if(!state)return[];state.previewCalendar??={label:currentSeasonLabel(state),club:state.player.club,matches:null};if(state.previewCalendar.label!==currentSeasonLabel(state)||state.previewCalendar.club!==state.player.club)state.previewCalendar={label:currentSeasonLabel(state),club:state.player.club,matches:null};if(state.previewCalendar.matches)return state.previewCalendar.matches;const r=quickSeeded(`${state.seed}|preview|${state.year}|${state.player.club}`),league=leagueForClub(state.player.club),opps=(league?.clubs||[]).filter(x=>x!==state.player.club),arr=[];for(let i=0;i<38;i++){const month=Math.min(9,Math.floor(i*10/38));arr.push({month,day:Math.min(28,3+((i-Math.floor(month*38/10))%4)*7),home:r()>.48,opponent:opps[Math.floor(r()*opps.length)]||'League Opponent',upcoming:true})}state.previewCalendar.matches=arr;return arr}
function quickCalendarHTML(){if(!state)return'';const season=state.lastSeason||null,matches=season?quickCalendarBuild(season):quickPreviewCalendar();if(!Number.isInteger(state.quickCalendarView))state.quickCalendarView=season?9:0;state.quickCalendarView=Math.max(0,Math.min(9,state.quickCalendarView));const idx=state.quickCalendarView,rows=matches.filter(m=>m.month===idx),year=(season?.year??state.year)+(idx>=5?1:0),played=rows.filter(m=>!m.upcoming),w=played.filter(m=>m.result==='W').length,d=played.filter(m=>m.result==='D').length,l=played.filter(m=>m.result==='L').length,g=played.reduce((n,m)=>n+(m.userGoals||0),0),a=played.reduce((n,m)=>n+(m.userAssists||0),0);return `<div class="panel quickCalendar"><div class="qCalHead"><button class="qCalArrow" id="qCalPrev">←</button><div class="qCalTitle"><b>${QUICK_MONTHS[idx]} ${year}</b><small>${season?`${season.label} RESULTS`:`${currentSeasonLabel(state)} UPCOMING`}</small></div><button class="qCalArrow" id="qCalNext">→</button></div><div class="qLegend"><span><i class="qDot w"></i>Win</span><span><i class="qDot d"></i>Draw</span><span><i class="qDot l"></i>Loss</span></div><div class="qCalRows">${rows.length?rows.map(m=>`<div class="qCalRow"><div class="qDay">${m.day}</div><span class="qDot ${m.upcoming?'u':m.result==='W'?'w':m.result==='D'?'d':'l'}"></span><div class="qOpp"><b>${m.home?'vs':'@'} ${esc(m.opponent)}</b><small>${m.upcoming?'League fixture':'Quick Story result'}</small></div><div class="qScore">${m.upcoming?'—':`${m.gf}–${m.ga}`}</div><div class="qGA">${m.upcoming?'Upcoming':m.played?`⚽ ${m.userGoals||0} · 🅰 ${m.userAssists||0}`:'DNP'}</div></div>`).join(''):`<div class="qEmpty">No fixtures this month.</div>`}</div><div class="qCalSummary"><span>${season?`${w}W ${d}D ${l}L`:`${rows.length} fixtures`}</span><span>${season?`Your month: ${g}G + ${a}A`:'Use the arrows to browse the season'}</span></div></div>`}
const simulateSeasonQuickCalendarBase=simulateSeason;
simulateSeason=function(st,choice=null){const s=simulateSeasonQuickCalendarBase(st,choice);if(s){quickCalendarBuild(s);st.quickCalendarView=9;st.previewCalendar=null}return s};
const renderJourneyQuickCalendarBase=renderJourney;
renderJourney=function(){renderJourneyQuickCalendarBase();const b=document.getElementById('tab-journey');if(!b||!state)return;b.insertAdjacentHTML('afterbegin',quickCalendarHTML());const p=b.querySelector('#qCalPrev'),n=b.querySelector('#qCalNext');if(p)p.onclick=()=>{state.quickCalendarView=Math.max(0,(state.quickCalendarView||0)-1);renderJourney()};if(n)n.onclick=()=>{state.quickCalendarView=Math.min(9,(state.quickCalendarView||0)+1);renderJourney()}};

function init(){const q=new URLSearchParams(location.search);if(q.get('autotest')==='1'){document.getElementById('app').classList.add('hidden');const out=runInternalTests(Number(q.get('count'))||1800),el=document.getElementById('test-results');el.classList.remove('hidden');el.textContent=JSON.stringify(out,null,2);document.title=out.ok?'TEST PASS':'TEST FAIL';return}if(q.get('demo')==='1'){state=createCareer('PUBLIC-DEMO',q.get('mode')||'express');for(let i=0;i<4;i++){simulateSeason(state,state.pendingStory?1:null);if(state.pendingOffers.length)stayPut(state)}startGame();return}renderLanding()}
